# Software Composition Analysis (SCA): keep dependencies patched. Dependabot
# opens PRs for known-vulnerable / outdated deps weekly. The npm ecosystem
# covers the pnpm workspace; github-actions keeps the CI action pins current.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        update-types:
          - minor
          - patch
