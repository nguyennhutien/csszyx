# Software Composition Analysis (SCA): keep dependencies patched. Dependabot
# opens PRs for outdated / known-vulnerable deps weekly. The npm ecosystem covers
# the pnpm workspace; github-actions keeps the SHA-pinned CI actions current
# (Dependabot bumps the commit SHA + the `# vN` comment, so the pins stay both
# immutable AND up to date).
#
# Security posture (risk=0): NOTHING is auto-merged — every PR is reviewed by a
# human (CI-green != safe: a compromised release passes tests and would ship to
# csszyx's npm consumers). Hardening here is defense-in-depth:
#   - `cooldown`: wait N days before opening a PR for a freshly published version,
#     so a compromised release that is yanked within days is never even proposed.
#   - dev/runtime split: separates non-shipped (development) from shipped
#     (production) deps so review can weigh blast radius (a runtime dep reaches
#     users; a dev dep can still steal the npm token at release time).
# Install scripts are blocked by pnpm 11's build policy: no dependency is granted
# permission through `allowBuilds`.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # Skip SCHEDULED major bumps — a breaking API change is a maintainer decision
    # to make deliberately, not a weekly chore PR to triage. This only affects
    # version-update PRs; Dependabot SECURITY updates ignore this filter and will
    # still open a PR (even a major one) when that is the only fix for an advisory.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
      # The workspace pins `next` at two majors on purpose: `playground/nextjs-16`
      # at an exact 16.x (its build runs `next build --webpack`, a 16-only flag)
      # and `playground/nextjs-ssr` at ^15. Dependabot merges the two into one
      # dependency whose version is the LOWER one, derives the semver-major
      # ignore range from that (`>= 16`), picks the newest 15.x, and rewrites
      # every requirement to it, so a grouped bump downgraded the 16 pin to
      # 15.5.24 and the build failed on the flag (dependabot-core
      # DependencySet#combined_dependency, RequirementsUpdater#updated_requirements).
      # Ignoring the name by itself only affects version updates: security
      # updates skip a bare dependency-name entry. Both pins move by hand.
      - dependency-name: "next"
      # 3.8.0 added a filesystem-transaction layer that aborts every native build
      # on a Docker Desktop bind mount, and 3.9.0 still ships it unchanged;
      # `scripts/napi-pin.test.mjs` fails the Validate Config job on any pin at
      # or above 3.8, so a grouped bump that carries one can never merge. A
      # `versions` entry applies to security updates as well, so an advisory on
      # 3.7.4 fixed only in 3.8+ would surface through the npm audit job, not a
      # Dependabot PR. Raise the pin by hand after re-bisecting on the bind
      # mount, per that test.
      - dependency-name: "@napi-rs/cli"
        versions: [">=3.8.0"]
    groups:
      npm-development:
        dependency-type: "development"
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: "production"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types:
          - minor
          - patch
