# Software Composition Analysis (SCA): keep dependencies patched. Dependabot
# opens PRs for outdated / known-vulnerable deps weekly. The npm ecosystem covers
# the pnpm workspace; github-actions keeps the SHA-pinned CI actions current
# (Dependabot bumps the commit SHA + the `# vN` comment, so the pins stay both
# immutable AND up to date).
#
# Security posture (risk=0): NOTHING is auto-merged — every PR is reviewed by a
# human (CI-green != safe: a compromised release passes tests and would ship to
# csszyx's npm consumers). Hardening here is defense-in-depth:
#   - `cooldown`: wait N days before opening a PR for a freshly published version,
#     so a compromised release that is yanked within days is never even proposed.
#   - dev/runtime split: separates non-shipped (development) from shipped
#     (production) deps so review can weigh blast radius (a runtime dep reaches
#     users; a dev dep can still steal the npm token at release time).
# Install scripts are blocked by pnpm 11's build policy: no dependency is granted
# permission through `allowBuilds`.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
    # Skip SCHEDULED major bumps — a breaking API change is a maintainer decision
    # to make deliberately, not a weekly chore PR to triage. This only affects
    # version-update PRs; Dependabot SECURITY updates ignore this filter and will
    # still open a PR (even a major one) when that is the only fix for an advisory.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      npm-development:
        dependency-type: "development"
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: "production"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types:
          - minor
          - patch
