name: Cache Astro fonts
description: >-
  Restore the font files Astro downloads while building the docs site, so a
  build does not depend on Google Fonts answering.

  apps/docs declares three Google families, and Astro fetches every weight and
  style from fonts.gstatic.com during `astro build`. That put a few dozen
  network requests in the path of every job that runs `pnpm build`, and a single
  failed request aborts the whole build: twice in two days CI went red with
  `[CannotFetchFontFile]`, once on JetBrains Mono and once on IBM Plex Sans,
  neither related to the change under test. `release.yml` builds the workspace
  too, so the same hiccup can block a publish.

  The cache is small — five woff2 files, about 1.7 MB — and keyed on the config
  that decides which fonts are fetched, so changing a family or a weight misses
  the cache and downloads afresh rather than serving a stale set.

  This does not remove the dependency, it removes the repetition: a cache miss
  still fetches. What it buys is that only the first job after a font-config
  change is exposed, instead of every job on every run.

runs:
  using: composite
  steps:
    - name: Restore Astro font cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        # Where Astro's cached-font-fetcher writes. It lives under
        # node_modules, which pnpm does not clean between runs, and is not
        # covered by the pnpm store cache — that caches downloaded packages,
        # not files a build writes into the tree.
        path: apps/docs/node_modules/.astro/fonts
        key: astro-fonts-${{ runner.os }}-${{ hashFiles('apps/docs/astro.config.mjs') }}
        # No restore-keys on purpose. A partial hit here would serve the font
        # set from a previous config, and Astro would fetch only what is
        # missing — which is correct, but it also means a removed family stays
        # cached forever. An exact key keeps the cache honest about its config.
