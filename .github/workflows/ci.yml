name: CI

# Phase 1 of the smart-CI rollout (see future-roadmap item #27 once added).
# This workflow detects what kind of changes a push or pull request brings,
# then runs only the jobs that those changes can affect. The aggregator
# job at the end (`CI Status`) is the single check branch protection
# should require — it passes when every upstream job either succeeds or
# is appropriately skipped.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emit boolean outputs the downstream jobs use to decide whether to run.
  # `release_please` is a fixed branch-name check (release-please's release
  # PR only touches version metadata, so the slow code jobs add no signal).
  # `code_ts` / `code_rust` come from the path filter and gate the language-
  # specific jobs.
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      release_please: ${{ steps.head-ref.outputs.is_release_please }}
      code_ts: ${{ steps.filter.outputs.code_ts }}
      code_rust: ${{ steps.filter.outputs.code_rust }}
    steps:
      - name: Detect release-please branch
        id: head-ref
        run: |
          if [ "${{ github.head_ref }}" = "release-please--branches--main" ]; then
            echo "is_release_please=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_release_please=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4

      - name: Detect file paths changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # The filters here are intentionally a superset of "changes that
          # could affect TS/Rust outputs". When in doubt, run the job —
          # path filtering is an optimisation, not the only safety net.
          filters: |
            code_ts:
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'packages/**/*.mts'
              - 'packages/**/*.cts'
              - 'packages/**/*.js'
              - 'packages/**/*.jsx'
              - 'apps/**/*.ts'
              - 'apps/**/*.tsx'
              - 'apps/**/*.mts'
              - 'apps/**/*.cts'
              - 'apps/**/*.js'
              - 'apps/**/*.jsx'
              - 'playground/**/*.ts'
              - 'playground/**/*.tsx'
              - 'playground/**/*.js'
              - 'playground/**/*.jsx'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'turbo.json'
              - '.eslintrc*'
              - 'eslint.config.*'
            code_rust:
              - 'packages/core/src/**'
              - 'packages/core/Cargo.toml'
              - 'packages/core/Cargo.lock'

  # Always-runs tripwire. Catches release-please config issues that path
  # filters and `release_please` skipping would otherwise let through.
  # Cheap (~5 s) — node + a small validation script, no install.
  validate-config:
    name: Validate Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate release-please config + manifest
        run: node .github/scripts/validate-release-please-config.mjs

  lint:
    name: Lint
    needs: detect-changes
    # Skip when:
    #   - this is a release-please PR (only version-field bumps), OR
    #   - no TS/Rust code changed (e.g. docs-only PR).
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      (needs.detect-changes.outputs.code_ts == 'true' || needs.detect-changes.outputs.code_rust == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.14.0'

      # Pre-install wasm-bindgen-cli so wasm-pack can run with
      # --mode no-install (skip its own wasm-bindgen install step). That
      # install step has a parse bug — "invalid type: sequence, expected
      # a string at line 3 column 19" — when wasm-pack is invoked twice
      # in the same job (bundler then nodejs). Version must match the
      # wasm-bindgen library pin in packages/core/Cargo.toml.
      - name: Cache wasm-bindgen-cli
        id: cache-wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.93-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.93 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM core
        run: pnpm --filter @csszyx/core build

      - name: Lint
        run: pnpm lint:check

      - name: Type check
        run: pnpm type-check

  test:
    name: Test
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      (needs.detect-changes.outputs.code_ts == 'true' || needs.detect-changes.outputs.code_rust == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Pin to v0.14.0 — 0.12.1 and 0.13.x both hit a "invalid type:
        # sequence, expected a string" parse error on the second wasm-pack
        # invocation within the same job (nodejs target after bundler).
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.14.0'

      - name: Cache wasm-pack tool downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-tools-${{ runner.os }}-v2

      - name: Cache wasm-bindgen-cli
        id: cache-wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.93-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.93 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM core
        run: pnpm --filter @csszyx/core build

      - name: Install Playwright browsers
        run: pnpm --filter @csszyx/e2e exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          directory: ./coverage

  build:
    name: Build
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      (needs.detect-changes.outputs.code_ts == 'true' || needs.detect-changes.outputs.code_rust == 'true')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Pin to v0.14.0 — 0.12.1 and 0.13.x both hit a "invalid type:
        # sequence, expected a string" parse error on the second wasm-pack
        # invocation within the same job (nodejs target after bundler).
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.14.0'

      - name: Cache wasm-pack tool downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-tools-${{ runner.os }}-v2

      - name: Cache wasm-bindgen-cli
        id: cache-wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.93-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.93 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM core
        run: pnpm --filter @csszyx/core build

      - name: Build
        run: pnpm build

  # Aggregator. Always runs. Branch protection should require this single
  # check rather than the individual jobs above — those may be legitimately
  # skipped (no relevant changes), and gating each separately would block
  # merges on every paths-ignored PR.
  ci-status:
    name: CI Status
    needs: [detect-changes, validate-config, lint, test, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify upstream jobs
        run: |
          results='${{ toJson(needs) }}'
          echo "Upstream job results:"
          echo "$results" | jq '.'

          # `skipped` is treated as success here — it means a job's path
          # filter or `release_please` flag legitimately excluded this PR.
          # `failure` and `cancelled` always fail the aggregator.
          if echo "$results" | jq -e '.[] | select(.result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::At least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "All upstream jobs passed or were appropriately skipped — CI green."
