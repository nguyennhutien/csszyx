name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Pin to v0.12.1 — v0.13.x has a regression parsing ~/.cargo/.crates.toml
        # on second invocation (nodejs target after bundler target in the same
        # job), failing with "invalid type: sequence, expected a string".
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.12.1'

      # Cache wasm-pack's lazy download of wasm-bindgen CLI. wasm-opt is
      # disabled in packages/core/Cargo.toml, so binaryen is never downloaded
      # here — release.yml re-runs wasm-opt manually with apt-installed
      # binaryen. Bump the cache key suffix if upgrading wasm-pack.
      - name: Cache wasm-pack tool downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/wasm-pack
          key: wasm-pack-tools-${{ runner.os }}-v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM core
        run: pnpm --filter @csszyx/core build

      - name: Lint
        run: pnpm lint:check

      - name: Type check
        run: pnpm type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Pin to v0.12.1 — v0.13.x has a regression parsing ~/.cargo/.crates.toml
        # on second invocation (nodejs target after bundler target in the same
        # job), failing with "invalid type: sequence, expected a string".
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.12.1'

      - name: Cache wasm-pack tool downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/wasm-pack
          key: wasm-pack-tools-${{ runner.os }}-v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM core
        run: pnpm --filter @csszyx/core build

      - name: Install Playwright browsers
        run: pnpm --filter @csszyx/e2e exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          directory: ./coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Pin to v0.12.1 — v0.13.x has a regression parsing ~/.cargo/.crates.toml
        # on second invocation (nodejs target after bundler target in the same
        # job), failing with "invalid type: sequence, expected a string".
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.12.1'

      - name: Cache wasm-pack tool downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/wasm-pack
          key: wasm-pack-tools-${{ runner.os }}-v1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM core
        run: pnpm --filter @csszyx/core build

      - name: Build
        run: pnpm build
