name: CI

# Phase 1 of the smart-CI rollout introduced change detection + the
# CI Status aggregator. Phase 2 adds a shared WASM artifact cache so
# TS-only PRs don't pay the wasm-pack rebuild cost three times. Cache
# key tracks Cargo manifests + Cargo.lock + Rust source + the build
# scripts that post-process the artefacts; any change there
# invalidates and triggers a real rebuild in any job that needs it.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emit boolean outputs the downstream jobs use to decide whether to run.
  # `release_please` is a fixed branch-name check (release-please's release
  # PR only touches version metadata, so the slow code jobs add no signal).
  # `code_ts` / `code_rust` come from the path filter and gate the language-
  # specific jobs.
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_please: ${{ steps.head-ref.outputs.is_release_please }}
      code_ts: ${{ steps.filter.outputs.code_ts }}
      code_rust: ${{ steps.filter.outputs.code_rust }}
      # package.json edits are gated by CONTENT, not path: a change to
      # dependencies/exports/scripts/... sets pkg_code; a metadata-only edit
      # (version, repository, engines, description, files) does not. This is
      # what lets release/provenance-style commits skip the heavy matrix.
      pkg_code: ${{ steps.pkg-gate.outputs.pkg_code }}
      # pnpm-lock.yaml is likewise gated by CONTENT: lock_code is true only when
      # the lockfile diff touches a package the workspace depends on DIRECTLY. A
      # change confined to transitive packages (Dependabot transitive bump,
      # dedupe) leaves it false so the heavy jobs skip. Fails open.
      lock_code: ${{ steps.lock-gate.outputs.lock_code }}
      # runtime_critical / next_state are refined from the raw path filters:
      # markdown files never count, package.json files count only when
      # pkg_code is true, anything else counts as-is (fail-open).
      runtime_critical: ${{ steps.refine.outputs.runtime_real }}
      next_state: ${{ steps.refine.outputs.next_real }}
      # 'true' only for PRs whose changes are confined to workspace
      # packages — the case where turbo's `--affected` is provably safe.
      # Pushes (main) and full_surface changes always run the full set.
      turbo_affected: ${{ github.event_name == 'pull_request' && steps.filter.outputs.full_surface != 'true' }}
    steps:
      - name: Detect release-please branch
        id: head-ref
        env:
          HEAD_REF: ${{ github.head_ref }}
          # On a pull_request, head_ref is the source branch. On the push that
          # merges the release PR there is no head_ref, so also match the
          # release-please commit subject — a pure version/CHANGELOG bump with
          # no code to validate. Without this the merge commit runs the full
          # matrix (the version bump touches package.json paths), including the
          # cross-process lock stress test that flakes under release-time load.
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          case "$HEAD_REF" in
            release-please--branches--main*)
              echo "is_release_please=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              case "$HEAD_COMMIT_MSG" in
                "chore(main): release "* | "chore: release "*)
                  echo "is_release_please=true" >> "$GITHUB_OUTPUT"
                  ;;
                *)
                  echo "is_release_please=false" >> "$GITHUB_OUTPUT"
                  ;;
              esac
              ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the pkg-gate step can `git show` package.json at
          # the base ref to diff field-level content.
          fetch-depth: 0

      - name: Detect file paths changed
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          list-files: csv
          # The filters here are intentionally a superset of "changes that
          # could affect TS/Rust outputs". When in doubt, run the job —
          # path filtering is an optimisation, not the only safety net.
          filters: |
            code_ts:
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'packages/**/*.mts'
              - 'packages/**/*.cts'
              - 'packages/**/*.js'
              - 'packages/**/*.jsx'
              - 'apps/**/*.ts'
              - 'apps/**/*.tsx'
              - 'apps/**/*.mts'
              - 'apps/**/*.cts'
              - 'apps/**/*.js'
              - 'apps/**/*.jsx'
              - 'playground/**/*.ts'
              - 'playground/**/*.tsx'
              - 'playground/**/*.js'
              - 'playground/**/*.jsx'
              - 'scripts/**/*.ts'
              - 'scripts/**/*.mts'
              - 'scripts/**/*.mjs'
              # Snippets are the source of truth for the per-sz-key test matrix
              # (scripts/gen-key-tests.mjs → sz-key-cases.json); a snippet edit
              # can make the committed fixture stale, so it must run the suite.
              - 'docs/specs/snippets/**'
              # package.json and pnpm-lock.yaml are intentionally NOT here — both
              # go through content-aware gates below (pkg-gate / lock-gate), so a
              # metadata-only package.json edit or a pure-transitive lockfile
              # change (a Dependabot transitive bump, a dedupe) does not run the
              # matrix; a direct-dependency change still does.
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'turbo.json'
              - 'biome.json'
              - 'eslint.config.*'
              - 'eslint.redos.config.mjs'
            code_rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'packages/core/src/**'
              - 'packages/core/Cargo.toml'
              - 'packages/core/Cargo.lock'
              - 'rust-toolchain.toml'
              - '.rustfmt.toml'
              - '.mise.toml'
            # E2E tests verify the runtime stack end-to-end against
            # built playgrounds. Trigger only when something in that
            # surface area changes.
            runtime_critical:
              - 'packages/csszyx/**'
              - 'packages/runtime/**'
              - 'packages/unplugin/**'
              - 'packages/compiler/**'
              - 'packages/dynamic/**'
              - 'packages/types/**'
              - 'packages/core/**'
              - 'packages/e2e/**'
              - 'playground/**'
            # Cross-process locking and atomic filesystem behavior need real
            # Windows/macOS runners. Keep this filter narrow so unrelated
            # TypeScript changes do not consume the platform matrix.
            next_state:
              - 'packages/unplugin/src/next-*.ts'
              - 'packages/unplugin/tests/next-*.test.ts'
              - 'packages/unplugin/tests/fixtures/next-lock-worker.ts'
              - 'packages/unplugin/package.json'
              - '.github/workflows/ci.yml'
            pkg_json:
              - '**/package.json'
            # Surfaces OUTSIDE the workspace package graph. Turbo's
            # `--affected` cannot see that these feed builds/tests (root
            # scripts, spec fixtures, repo configs, workflows), so when any
            # of them change the affected-scoping below is bypassed and
            # turbo runs the full workspace — fail-open. `pnpm-lock.yaml`
            # is intentionally NOT listed: turbo 2 maps a lockfile diff to
            # exactly the packages it touches (verified empirically), and
            # over-running on lock changes is the waste this gate removes.
            full_surface:
              - '.github/**'
              - 'scripts/**'
              - 'tests/**'
              - 'docs/**'
              - 'package.json'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'biome.json'
              - 'eslint.config.*'
              - 'eslint.redos.config.mjs'
              - 'lefthook.yml'
              - 'cog.toml'
              - '.mise.toml'
              - 'rust-toolchain.toml'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'vitest.config.*'
              - 'playwright.config.*'

      # Content-aware gate for package.json edits: only dependency / exports /
      # scripts / bin-style fields count as code; version, repository, engines
      # and other publish metadata do not. Fails open when the base ref is
      # unusable.
      - name: Gate package.json changes by content
        id: pkg-gate
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          CHANGED_PKG_JSON_CSV: ${{ steps.filter.outputs.pkg_json_files }}
        run: |
          CHANGED_PKG_JSON="$(printf '%s' "$CHANGED_PKG_JSON_CSV" | tr ',' '\n')" \
            node .github/scripts/detect-pkg-code-changes.mjs

      # Content-aware gate for pnpm-lock.yaml: lock_code is true only when the
      # lockfile diff touches a package the workspace depends on directly. A
      # change confined to transitive packages does not run the matrix. Reads the
      # diff against the base ref; fails open when the base is unusable.
      - name: Gate pnpm-lock.yaml changes by dependency relevance
        id: lock-gate
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: node .github/scripts/detect-lock-code-changes.mjs

      # Refine the path-only filters: markdown never triggers a job, and
      # package.json files only trigger one when the pkg-gate above says the
      # change is code-relevant. Any other matched file counts (fail-open).
      - name: Refine runtime/next-state triggers
        id: refine
        env:
          RUNTIME_FILES: ${{ steps.filter.outputs.runtime_critical_files }}
          NEXT_FILES: ${{ steps.filter.outputs.next_state_files }}
          PKG_CODE: ${{ steps.pkg-gate.outputs.pkg_code }}
        run: |
          refine() {
            local files_csv=$1 result=false f
            IFS=',' read -ra files <<< "$files_csv"
            for f in "${files[@]}"; do
              [ -z "$f" ] && continue
              case "$f" in
                *.md) ;;
                *package.json) [ "$PKG_CODE" = "true" ] && result=true ;;
                *) result=true ;;
              esac
            done
            echo "$result"
          }
          echo "runtime_real=$(refine "$RUNTIME_FILES")" >> "$GITHUB_OUTPUT"
          echo "next_real=$(refine "$NEXT_FILES")" >> "$GITHUB_OUTPUT"

  # Always-runs tripwire. Catches release-please config issues that path
  # filters and `release_please` skipping would otherwise let through.
  # Cheap (~5 s) — node + a small validation script, no install.
  validate-config:
    name: Validate Config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - name: Validate release-please config + manifest
        run: node .github/scripts/validate-release-please-config.mjs
      - name: Test commit-message policy
        run: node --test scripts/validate-commit-message-policy.test.mjs
      - name: Test resumable npm publisher
        run: node --test .github/scripts/publish-workspace.test.mjs
      - name: Test package.json content gate
        run: node --test .github/scripts/detect-pkg-code-changes.test.mjs
      - name: Test pnpm-lock.yaml content gate
        run: node --test .github/scripts/detect-lock-code-changes.test.mjs
      # Invoked through `node`, not the matching pnpm script: this job is
      # deliberately install-free (see the header above), so pnpm is not on
      # PATH here. The duplication with package.json is the price of that.
      - name: Reject broken or external tracked symlinks
        run: |
          node --test scripts/validate-tracked-symlinks.test.mjs
          node scripts/validate-tracked-symlinks.mjs
      # A raw NUL byte flips Git's binary heuristic for the whole file: the PR
      # renders "Binary file not shown" and git grep goes blind. Escapes only.
      - name: Reject raw NUL bytes in tracked text files
        run: |
          node --test scripts/validate-no-nul-bytes.test.mjs
          node scripts/validate-no-nul-bytes.mjs
      - name: Validate native package metadata
        run: node packages/core/scripts/validate-native-packages.mjs

  # Backstop for the lefthook commit-msg hook. Re-runs the commit-message policy
  # over every commit a PR adds, so a message release-please cannot parse (e.g.
  # unbalanced or nested parentheses, which make it silently drop the commit and
  # skip the release) is caught before merge even if a contributor bypassed the
  # local hook. Skipped on push (the aggregator counts a skip as success).
  commit-messages:
    name: Commit Messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
      - name: Validate PR commit messages
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          bash scripts/verify-commit-messages-range.sh "origin/${{ github.base_ref }}" HEAD

  # Fast Biome preflight. Runs the same `pnpm lint:fast` script as
  # local dev (Biome only, no ESLint, no Rust toolchain) so most
  # formatting, import-order, and syntax lint issues surface before
  # the heavier `lint` job's WASM cache restore + ESLint pass would.
  # The `lint` job below depends on this, so a failed Biome run skips
  # the slower lint stage entirely.
  lint-fast:
    name: Lint (Biome preflight)
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      (needs.detect-changes.outputs.code_ts == 'true' || needs.detect-changes.outputs.code_rust == 'true' || needs.detect-changes.outputs.pkg_code == 'true' || needs.detect-changes.outputs.lock_code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm lint:fast

  lint:
    name: Lint
    # Gated on lint-fast so Biome failures fail the gate fast and
    # skip the heavier ESLint + type-check pass.
    needs: [detect-changes, lint-fast]
    # Skip when:
    #   - this is a release-please PR (only version-field bumps), OR
    #   - no TS/Rust code changed (e.g. docs-only PR).
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      (needs.detect-changes.outputs.code_ts == 'true' || needs.detect-changes.outputs.code_rust == 'true' || needs.detect-changes.outputs.pkg_code == 'true' || needs.detect-changes.outputs.lock_code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      # Restore turbo's own cache directory. Turbo computes a hash of
      # task inputs and stores outputs under `.turbo/cache/{hash}/`. When
      # the hash matches a prior run, turbo skips the task entirely
      # without invoking the build command — no wasm-pack, no Rust at
      # all on cache hit. The unique-per-SHA key plus restore-keys
      # fallback gives us "perfect" replay on rerun and "near-perfect"
      # incremental on follow-up commits.
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the host native addon before the workspace build below. The
      # default build.parser is "rust" and playgrounds invoke csszyx during
      # their production build, so without the host addon every playground
      # build fails with CsszyxNativeUnavailableError. Mirrors the test/e2e/
      # build jobs.
      - name: Build host native engine
        run: pnpm --filter @csszyx/core native:build -- --clean --native-engine

      # ESLint only — Biome already ran in the lint-fast preflight.
      # Running it again here would duplicate formatting/import/basic
      # lint work for no extra signal.
      - name: Lint (eslint)
        run: pnpm exec eslint .

      - name: Test TypeScript repository scripts
        run: pnpm test:scripts

      # ReDoS gate — recheck-backed, on its own config. Catches the
      # polynomial / search-position class that neither eslint-plugin-regexp
      # rule detects and that previously reached main as CodeQL-only findings.
      # RECHECK_BACKEND=pure keeps it deterministic (no native binary / JVM).
      - name: ReDoS gate (recheck)
        run: pnpm lint:redos

      # Build the workspace before type-checking. `tsc -b` resolves
      # workspace deps (`@csszyx/core`, `@csszyx/compiler/browser`,
      # `@csszyx/cli`, …) through `node_modules` → `dist/*.d.mts`.
      # `@csszyx/core` is Rust/WASM (outside the TS project graph) and
      # the `./browser` subpath emits via `unbuild` (also outside the
      # TS graph), so `tsc -b` cannot synthesise those `.d.mts` files
      # on its own. Locally the dist is cached between runs; CI is a
      # fresh checkout and must produce them explicitly.
      # turbo caches build outputs (see "Cache turbo" above), so this
      # step is fast on cache hit and avoids re-running wasm-pack.
      - name: Build workspace (populate dist for tsc -b)
        run: pnpm build

      - name: Type check
        run: pnpm type-check

  test:
    name: Test
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      (needs.detect-changes.outputs.code_ts == 'true' || needs.detect-changes.outputs.code_rust == 'true' || needs.detect-changes.outputs.pkg_code == 'true' || needs.detect-changes.outputs.lock_code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so turbo `--affected` can diff against the PR base.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      # Restore turbo's own cache directory. Turbo computes a hash of
      # task inputs and stores outputs under `.turbo/cache/{hash}/`. When
      # the hash matches a prior run, turbo skips the task entirely
      # without invoking the build command — no wasm-pack, no Rust at
      # all on cache hit. The unique-per-SHA key plus restore-keys
      # fallback gives us "perfect" replay on rerun and "near-perfect"
      # incremental on follow-up commits.
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The per-sz-key test matrix (packages/cli/tests/sz-key-matrix.test.ts) is
      # driven by a committed fixture generated from docs/specs/snippets. Fail if
      # regenerating would change it, so the snippets, generator, and fixture
      # never drift apart.
      - name: Check sz-key test fixture is current
        run: pnpm gen:key-tests:check

      # The runtime box-role map (splitBox / classify / has / pick / omit) is
      # generated from the compiler's PROPERTY_MAP / REMOVED_BOOLEAN_SUGAR /
      # BOOLEAN_SHORTHANDS. Fail if regenerating would change it, so a new sz prop
      # can't leave a class unclassified for box-model routing.
      - name: Check runtime box-role map is current
        run: pnpm gen:box-role:check

      # The three engines must print identical sz runtime-fallback wording — a
      # build can switch between them with `build.parser`, and text that changes
      # on a parser flip reads as a behaviour change. TypeScript imports the
      # matrix; Rust gets a generated copy. Fail if the copy is stale.
      - name: Check sz fallback matrix is current
        run: pnpm gen:sz-fallback-matrix:check

      # llms.txt / llms-full.txt are GENERATED from docs/specs/llms-template.md
      # plus the snippets — a hand edit to the outputs is silently overwritten
      # by the next `pnpm build`. Fail while the drift is still visible.
      - name: Check llms outputs are current
        run: pnpm gen:llms:check

      # The sz-key allowlist (purifySz's authoritative set for untrusted input)
      # is generated from the compiler's PROPERTY_MAP / BOOLEAN_SHORTHANDS. Fail
      # if regenerating would change it, so a new sz prop can't be silently
      # rejected as "unknown" by the purify boundary.
      - name: Check sz-key allowlist is current
        run: pnpm gen:sz-allowlist:check

      # The TS↔Rust lowering parity corpus ingests every documented sz-key
      # forward case, so the Rust default engine is proven equivalent to the TS
      # engine for each key. Fail if regenerating would change it, so a snippet,
      # generator, or compiler change can't leave the corpus stale.
      #
      # This is also what closes the "rust-check only triggers on packages/core/**"
      # gap for a pure-snippet key change: the corpus lives at
      # packages/core/tests/fixtures/parity-corpus.json. A snippet that changes any
      # key's emitted class makes this check fail until the corpus is regenerated;
      # the regenerated corpus is a packages/core file, so committing it TRIGGERS
      # rust-check (cargo test --test parity_corpus runs the Rust==TS comparison on
      # the new cases). If the corpus does NOT change, there is nothing new for the
      # Rust engine to verify. So do NOT add docs/specs/snippets to rust-check.yml
      # paths — that would re-run the full Rust suite on every prose-only doc edit
      # (the same over-trigger this repo deliberately avoids for release PRs).
      - name: Check Rust parity corpus is current
        run: pnpm gen:parity-corpus:check

      # The Rust transform lookup tables are generated from the TS compiler's
      # PROPERTY_MAP/VARIANT_MAP. Fail if regenerating would change them, so the
      # native engine can't drift from the TS source of truth.
      - name: Check Rust transform tables are current
        run: pnpm gen:rust-tables:check

      # The per-key matrix fixture and the parity corpus are derived independently
      # from the snippets; the staleness checks only prove each is internally
      # fresh. Assert the corpus actually covers every per-key forward case, so the
      # Rust default engine can't silently lose coverage for a key.
      - name: Check parity corpus covers the per-key matrix
        run: pnpm check:key-corpus

      # The corpus round-trip checks every documented Tailwind class maps back to
      # an sz form AND that the mapping compiles to the SAME class. The plain
      # check is advisory; --require-no-broken fails only when a class maps but
      # compiles to the WRONG output (a real correctness regression) — it ignores
      # the unmapped-class noise.
      - name: Check corpus round-trip has no broken mappings
        run: pnpm corpus:check --require-no-broken

      # The round-trip above proves sz -> class -> sz is stable, but not that the
      # class Tailwind is asked for still EXISTS: the vocabulary moves between
      # minors (break-* became wrap-* in v4.1) and a stale name styles nothing,
      # silently. This asks the installed Tailwind to compile every emitted class
      # and fails on any that produces no CSS and is not baselined.
      - name: Check emitted classes still produce CSS
        run: pnpm check:emitted-classes

      # Build the host native addon before unit tests so the Rust parser
      # option suite exercises the same optional package-name resolution path
      # users get after install. The build artefact is gitignored and remains
      # available to all tests in this job. Runs even under --affected: tests
      # of compiler/unplugin exercise the rust parser regardless of whether
      # @csszyx/core itself changed.
      - name: Build host native engine
        run: pnpm --filter @csszyx/core native:build -- --clean --native-engine

      # Build the core WASM (pkg-node) explicitly so the WASM-dependent unit
      # tests are deterministic regardless of turbo's build ordering. The
      # runtime parity gate (tests/wasm-runtime-parity.test.ts) replays the
      # parity corpus through the WASM transform_sz and compares to the TS
      # source of truth — the runtime twin of the static parity_corpus.rs, so a
      # drift in either Rust forward path fails here. integration.test.ts needs
      # the same artefact.
      - name: Build core WASM
        run: pnpm --filter @csszyx/core build

      # Mirrors `test:unit` (`turbo run test --filter=!@csszyx/e2e` — keep in
      # sync with package.json). Playwright tests live in @csszyx/e2e and run
      # in their own job below — they need a different gate (runtime_critical,
      # not just code_ts) and a different setup (browser install + production
      # playgrounds). On package-confined PRs turbo additionally scopes to
      # packages affected since the PR base; turbo 2 maps even lockfile-only
      # diffs to the packages they touch, so a dep bump no longer tests the
      # whole workspace. Coverage upload below is partial on scoped runs.
      - name: Run unit tests
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: >
          pnpm exec turbo run test --filter=!@csszyx/e2e
          ${{ needs.detect-changes.outputs.turbo_affected == 'true' && '--affected' || '' }}

      # Explicit native-engine package smoke. Unit tests already exercise the
      # Rust parser branch when the host addon exists, but this step verifies
      # the install-style optional package load path and the real N-API
      # transform contract in one place. It cleans the generated .node before
      # exiting, so it intentionally runs after unit tests.
      - name: Smoke native engine package
        run: pnpm --filter @csszyx/core native:engine:smoke

      - name: Upload coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        if: always()
        with:
          directory: ./coverage

  # The Next Turbopack state layer relies on advisory locks, atomic rename,
  # path normalization, and child-process contention. Unit mocks on Ubuntu
  # cannot prove those contracts for APFS or NTFS, so run only the focused
  # state tests on real hosted runners when that surface changes.
  next-state-platform:
    name: Next State (${{ matrix.os }})
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      needs.detect-changes.outputs.next_state == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Next state platform tests
        run: >-
          pnpm --filter @csszyx/unplugin exec vitest run
          tests/next-lock-process.test.ts
          tests/next-safelist-state.test.ts
          tests/next-root-resolver.test.ts
          tests/next-watcher-loop.test.ts
          tests/next-watcher.test.ts

  # End-to-end tests against the built playgrounds (Vite-React,
  # Next.js-SSR, vanilla HTML). Slower than the unit job because it has
  # to build the workspace first and install playwright browsers, so
  # gated more tightly on `runtime_critical` paths — pure CLI / docs /
  # adapter changes don't trigger it.
  e2e:
    name: E2E
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      needs.detect-changes.outputs.runtime_critical == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      # Restore turbo's own cache directory. Turbo computes a hash of
      # task inputs and stores outputs under `.turbo/cache/{hash}/`. When
      # the hash matches a prior run, turbo skips the task entirely
      # without invoking the build command — no wasm-pack, no Rust at
      # all on cache hit. The unique-per-SHA key plus restore-keys
      # fallback gives us "perfect" replay on rerun and "near-perfect"
      # incremental on follow-up commits.
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the host native addon before the workspace build. The default
      # build.parser is "rust" and playgrounds invoke csszyx during their
      # production build, so without the host addon every playground build
      # fails with CsszyxNativeUnavailableError. The release publish matrix
      # builds the addon per platform for releases; this step is the
      # CI-only equivalent for the host runner.
      - name: Build host native engine
        run: pnpm --filter @csszyx/core native:build -- --clean --native-engine

      # Build all workspace packages so the production playgrounds can
      # start (Next.js-SSR's `next start` and the Vite preview both need
      # built dist/ outputs). turbo's local cache makes the cold cost
      # bearable; subsequent runs that pick up the actions/cache for
      # turbo would be even faster — Phase 4 candidate.
      - name: Build workspace
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @csszyx/e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 14

  build:
    name: Build
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      (needs.detect-changes.outputs.code_ts == 'true' || needs.detect-changes.outputs.code_rust == 'true' || needs.detect-changes.outputs.pkg_code == 'true' || needs.detect-changes.outputs.lock_code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so turbo `--affected` can diff against the PR base.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      # Restore turbo's own cache directory. Turbo computes a hash of
      # task inputs and stores outputs under `.turbo/cache/{hash}/`. When
      # the hash matches a prior run, turbo skips the task entirely
      # without invoking the build command — no wasm-pack, no Rust at
      # all on cache hit. The unique-per-SHA key plus restore-keys
      # fallback gives us "perfect" replay on rerun and "near-perfect"
      # incremental on follow-up commits.
      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the host native addon before the workspace build. The default
      # build.parser is "rust" and playgrounds invoke csszyx during their
      # production build, so without the host addon every playground build
      # fails with CsszyxNativeUnavailableError. Mirrors the e2e/test jobs.
      - name: Build host native engine
        run: pnpm --filter @csszyx/core native:build -- --clean --native-engine

      # Mirrors `pnpm build` (`gen:llms` + `turbo run build` — keep in sync
      # with package.json). On package-confined PRs turbo scopes the build to
      # affected packages + their dependents; pushes to main and full_surface
      # PRs build the whole workspace.
      - name: Build
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          pnpm run gen:llms
          pnpm exec turbo run build ${{ needs.detect-changes.outputs.turbo_affected == 'true' && '--affected' || '' }}

      # Absolute gzip budgets for the JS that reaches user bundles (runtime,
      # dynamic, the compiler browser entry closure). Bytes are deterministic,
      # so unlike timing this can be a hard gate with zero flake risk. The
      # gated packages are built explicitly first: the workspace build above
      # may scope them away via --affected, and the check treats a missing
      # dist as a failure rather than a pass — turbo serves already-built
      # packages from cache, so the extra build is seconds, not minutes.
      - name: Package size gate
        run: |
          pnpm exec turbo run build --filter=@csszyx/runtime --filter=@csszyx/dynamic --filter=@csszyx/compiler
          pnpm check:package-size

  # Aggregator. Always runs. Branch protection should require this single
  # check rather than the individual jobs above — those may be legitimately
  # skipped (no relevant changes), and gating each separately would block
  # merges on every paths-ignored PR.
  ci-status:
    name: CI Status
    needs:
      [
        detect-changes,
        validate-config,
        commit-messages,
        lint-fast,
        lint,
        test,
        next-state-platform,
        e2e,
        build,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify upstream jobs
        run: |
          results='${{ toJson(needs) }}'
          echo "Upstream job results:"
          echo "$results" | jq '.'

          # `skipped` is treated as success here — it means a job's path
          # filter or `release_please` flag legitimately excluded this PR.
          # `failure` and `cancelled` always fail the aggregator.
          if echo "$results" | jq -e '.[] | select(.result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::At least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "All upstream jobs passed or were appropriately skipped — CI green."
