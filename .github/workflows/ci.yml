name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.14.0'

      # Pre-install wasm-bindgen-cli so wasm-pack can run with
      # --mode no-install (skip its own wasm-bindgen install step). That
      # install step has a parse bug — "invalid type: sequence, expected
      # a string at line 3 column 19" — when wasm-pack is invoked twice
      # in the same job (bundler then nodejs). Version must match the
      # wasm-bindgen library pin in packages/core/Cargo.toml.
      - name: Cache wasm-bindgen-cli
        id: cache-wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.93-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.93 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM core
        run: pnpm --filter @csszyx/core build

      - name: Lint
        run: pnpm lint:check

      - name: Type check
        run: pnpm type-check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Pin to v0.14.0 — 0.12.1 and 0.13.x both hit a "invalid type:
        # sequence, expected a string" parse error on the second wasm-pack
        # invocation within the same job (nodejs target after bundler).
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.14.0'

      - name: Cache wasm-pack tool downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-tools-${{ runner.os }}-v2

      - name: Cache wasm-bindgen-cli
        id: cache-wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.93-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.93 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM core
        run: pnpm --filter @csszyx/core build

      - name: Install Playwright browsers
        run: pnpm --filter @csszyx/e2e exec playwright install --with-deps chromium

      - name: Run tests
        run: pnpm test

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: always()
        with:
          directory: ./coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        # Pin to v0.14.0 — 0.12.1 and 0.13.x both hit a "invalid type:
        # sequence, expected a string" parse error on the second wasm-pack
        # invocation within the same job (nodejs target after bundler).
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.14.0'

      - name: Cache wasm-pack tool downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/.wasm-pack
          key: wasm-pack-tools-${{ runner.os }}-v2

      - name: Cache wasm-bindgen-cli
        id: cache-wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.93-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.93 --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM core
        run: pnpm --filter @csszyx/core build

      - name: Build
        run: pnpm build
