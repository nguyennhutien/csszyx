name: CI

# Phase 1 of the smart-CI rollout introduced change detection + the
# CI Status aggregator. Phase 2 adds a shared WASM artifact cache so
# TS-only PRs don't pay the wasm-pack rebuild cost three times. Cache
# key tracks Cargo manifests + Cargo.lock + Rust source + the build
# scripts that post-process the artefacts; any change there
# invalidates and triggers a real rebuild in any job that needs it.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Emit boolean outputs the downstream jobs use to decide whether to run.
  # `release_please` is a fixed branch-name check (release-please's release
  # PR only touches version metadata, so the slow code jobs add no signal).
  # `code_ts` / `code_rust` come from the path filter and gate the language-
  # specific jobs.
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_please: ${{ steps.head-ref.outputs.is_release_please }}
      code_ts: ${{ steps.filter.outputs.code_ts }}
      code_rust: ${{ steps.filter.outputs.code_rust }}
      runtime_critical: ${{ steps.filter.outputs.runtime_critical }}
      next_state: ${{ steps.filter.outputs.next_state }}
    steps:
      - name: Detect release-please branch
        id: head-ref
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release-please--branches--main*)
              echo "is_release_please=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "is_release_please=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - uses: actions/checkout@v6

      - name: Detect file paths changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # The filters here are intentionally a superset of "changes that
          # could affect TS/Rust outputs". When in doubt, run the job —
          # path filtering is an optimisation, not the only safety net.
          filters: |
            code_ts:
              - 'packages/**/*.ts'
              - 'packages/**/*.tsx'
              - 'packages/**/*.mts'
              - 'packages/**/*.cts'
              - 'packages/**/*.js'
              - 'packages/**/*.jsx'
              - 'apps/**/*.ts'
              - 'apps/**/*.tsx'
              - 'apps/**/*.mts'
              - 'apps/**/*.cts'
              - 'apps/**/*.js'
              - 'apps/**/*.jsx'
              - 'playground/**/*.ts'
              - 'playground/**/*.tsx'
              - 'playground/**/*.js'
              - 'playground/**/*.jsx'
              - 'scripts/**/*.ts'
              - 'scripts/**/*.mts'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'turbo.json'
              - 'biome.json'
              - 'eslint.config.*'
            code_rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'packages/core/src/**'
              - 'packages/core/Cargo.toml'
              - 'packages/core/Cargo.lock'
              - 'rust-toolchain.toml'
              - '.rustfmt.toml'
              - '.mise.toml'
            # E2E tests verify the runtime stack end-to-end against
            # built playgrounds. Trigger only when something in that
            # surface area changes.
            runtime_critical:
              - 'packages/csszyx/**'
              - 'packages/runtime/**'
              - 'packages/unplugin/**'
              - 'packages/compiler/**'
              - 'packages/dynamic/**'
              - 'packages/types/**'
              - 'packages/core/**'
              - 'packages/e2e/**'
              - 'playground/**'
            # Cross-process locking and atomic filesystem behavior need real
            # Windows/macOS runners. Keep this filter narrow so unrelated
            # TypeScript changes do not consume the platform matrix.
            next_state:
              - 'packages/unplugin/src/next-*.ts'
              - 'packages/unplugin/tests/next-*.test.ts'
              - 'packages/unplugin/tests/fixtures/next-lock-worker.ts'
              - 'packages/unplugin/package.json'
              - '.github/workflows/ci.yml'

  # Always-runs tripwire. Catches release-please config issues that path
  # filters and `release_please` skipping would otherwise let through.
  # Cheap (~5 s) — node + a small validation script, no install.
  validate-config:
    name: Validate Config
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate release-please config + manifest
        run: node .github/scripts/validate-release-please-config.mjs
      - name: Test resumable npm publisher
        run: node --test .github/scripts/publish-workspace.test.mjs
      - name: Validate native package metadata
        run: node packages/core/scripts/validate-native-packages.mjs

  # Fast Biome preflight. Runs the same `pnpm lint:fast` script as
  # local dev (Biome only, no ESLint, no Rust toolchain) so most
  # formatting, import-order, and syntax lint issues surface before
  # the heavier `lint` job's WASM cache restore + ESLint pass would.
  # The `lint` job below depends on this, so a failed Biome run skips
  # the slower lint stage entirely.
  lint-fast:
    name: Lint (Biome preflight)
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      (needs.detect-changes.outputs.code_ts == 'true' || needs.detect-changes.outputs.code_rust == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm lint:fast

  lint:
    name: Lint
    # Gated on lint-fast so Biome failures fail the gate fast and
    # skip the heavier ESLint + type-check pass.
    needs: [detect-changes, lint-fast]
    # Skip when:
    #   - this is a release-please PR (only version-field bumps), OR
    #   - no TS/Rust code changed (e.g. docs-only PR).
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      (needs.detect-changes.outputs.code_ts == 'true' || needs.detect-changes.outputs.code_rust == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      # Restore turbo's own cache directory. Turbo computes a hash of
      # task inputs and stores outputs under `.turbo/cache/{hash}/`. When
      # the hash matches a prior run, turbo skips the task entirely
      # without invoking the build command — no wasm-pack, no Rust at
      # all on cache hit. The unique-per-SHA key plus restore-keys
      # fallback gives us "perfect" replay on rerun and "near-perfect"
      # incremental on follow-up commits.
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the host native addon before the workspace build below. The
      # default build.parser is "rust" and playgrounds invoke csszyx during
      # their production build, so without the host addon every playground
      # build fails with CsszyxNativeUnavailableError. Mirrors the test/e2e/
      # build jobs.
      - name: Build host native engine
        run: pnpm --filter @csszyx/core native:build -- --clean --native-engine

      # ESLint only — Biome already ran in the lint-fast preflight.
      # Running it again here would duplicate formatting/import/basic
      # lint work for no extra signal.
      - name: Lint (eslint)
        run: pnpm exec eslint .

      # Build the workspace before type-checking. `tsc -b` resolves
      # workspace deps (`@csszyx/core`, `@csszyx/compiler/browser`,
      # `@csszyx/cli`, …) through `node_modules` → `dist/*.d.mts`.
      # `@csszyx/core` is Rust/WASM (outside the TS project graph) and
      # the `./browser` subpath emits via `unbuild` (also outside the
      # TS graph), so `tsc -b` cannot synthesise those `.d.mts` files
      # on its own. Locally the dist is cached between runs; CI is a
      # fresh checkout and must produce them explicitly.
      # turbo caches build outputs (see "Cache turbo" above), so this
      # step is fast on cache hit and avoids re-running wasm-pack.
      - name: Build workspace (populate dist for tsc -b)
        run: pnpm build

      - name: Type check
        run: pnpm type-check

  test:
    name: Test
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      (needs.detect-changes.outputs.code_ts == 'true' || needs.detect-changes.outputs.code_rust == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      # Restore turbo's own cache directory. Turbo computes a hash of
      # task inputs and stores outputs under `.turbo/cache/{hash}/`. When
      # the hash matches a prior run, turbo skips the task entirely
      # without invoking the build command — no wasm-pack, no Rust at
      # all on cache hit. The unique-per-SHA key plus restore-keys
      # fallback gives us "perfect" replay on rerun and "near-perfect"
      # incremental on follow-up commits.
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the host native addon before unit tests so the Rust parser
      # option suite exercises the same optional package-name resolution path
      # users get after install. The build artefact is gitignored and remains
      # available to all tests in this job.
      - name: Build host native engine
        run: pnpm --filter @csszyx/core native:build -- --clean --native-engine

      # `test:unit` is `turbo run test --filter=!@csszyx/e2e`. Playwright
      # tests live in @csszyx/e2e and run in their own job below — they
      # need a different gate (runtime_critical, not just code_ts) and a
      # different setup (browser install + production playgrounds).
      - name: Run unit tests
        run: pnpm test:unit

      # Explicit native-engine package smoke. Unit tests already exercise the
      # Rust parser branch when the host addon exists, but this step verifies
      # the install-style optional package load path and the real N-API
      # transform contract in one place. It cleans the generated .node before
      # exiting, so it intentionally runs after unit tests.
      - name: Smoke native engine package
        run: pnpm --filter @csszyx/core native:engine:smoke

      - name: Upload coverage
        uses: codecov/codecov-action@v6
        if: always()
        with:
          directory: ./coverage

  # The Next Turbopack state layer relies on advisory locks, atomic rename,
  # path normalization, and child-process contention. Unit mocks on Ubuntu
  # cannot prove those contracts for APFS or NTFS, so run only the focused
  # state tests on real hosted runners when that surface changes.
  next-state-platform:
    name: Next State (${{ matrix.os }})
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      needs.detect-changes.outputs.next_state == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Next state platform tests
        run: >-
          pnpm --filter @csszyx/unplugin exec vitest run
          tests/next-lock-process.test.ts
          tests/next-safelist-state.test.ts
          tests/next-root-resolver.test.ts
          tests/next-watcher-loop.test.ts
          tests/next-watcher.test.ts

  # End-to-end tests against the built playgrounds (Vite-React,
  # Next.js-SSR, vanilla HTML). Slower than the unit job because it has
  # to build the workspace first and install playwright browsers, so
  # gated more tightly on `runtime_critical` paths — pure CLI / docs /
  # adapter changes don't trigger it.
  e2e:
    name: E2E
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      needs.detect-changes.outputs.runtime_critical == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      # Restore turbo's own cache directory. Turbo computes a hash of
      # task inputs and stores outputs under `.turbo/cache/{hash}/`. When
      # the hash matches a prior run, turbo skips the task entirely
      # without invoking the build command — no wasm-pack, no Rust at
      # all on cache hit. The unique-per-SHA key plus restore-keys
      # fallback gives us "perfect" replay on rerun and "near-perfect"
      # incremental on follow-up commits.
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the host native addon before the workspace build. The default
      # build.parser is "rust" and playgrounds invoke csszyx during their
      # production build, so without the host addon every playground build
      # fails with CsszyxNativeUnavailableError. The release publish matrix
      # builds the addon per platform for releases; this step is the
      # CI-only equivalent for the host runner.
      - name: Build host native engine
        run: pnpm --filter @csszyx/core native:build -- --clean --native-engine

      # Build all workspace packages so the production playgrounds can
      # start (Next.js-SSR's `next start` and the Vite preview both need
      # built dist/ outputs). turbo's local cache makes the cold cost
      # bearable; subsequent runs that pick up the actions/cache for
      # turbo would be even faster — Phase 4 candidate.
      - name: Build workspace
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @csszyx/e2e exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: packages/e2e/playwright-report/
          retention-days: 14

  build:
    name: Build
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.release_please != 'true' &&
      (needs.detect-changes.outputs.code_ts == 'true' || needs.detect-changes.outputs.code_rust == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "pnpm"

      # Restore turbo's own cache directory. Turbo computes a hash of
      # task inputs and stores outputs under `.turbo/cache/{hash}/`. When
      # the hash matches a prior run, turbo skips the task entirely
      # without invoking the build command — no wasm-pack, no Rust at
      # all on cache hit. The unique-per-SHA key plus restore-keys
      # fallback gives us "perfect" replay on rerun and "near-perfect"
      # incremental on follow-up commits.
      - name: Cache turbo
        uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build the host native addon before the workspace build. The default
      # build.parser is "rust" and playgrounds invoke csszyx during their
      # production build, so without the host addon every playground build
      # fails with CsszyxNativeUnavailableError. Mirrors the e2e/test jobs.
      - name: Build host native engine
        run: pnpm --filter @csszyx/core native:build -- --clean --native-engine

      - name: Build
        run: pnpm build

  # Aggregator. Always runs. Branch protection should require this single
  # check rather than the individual jobs above — those may be legitimately
  # skipped (no relevant changes), and gating each separately would block
  # merges on every paths-ignored PR.
  ci-status:
    name: CI Status
    needs:
      [
        detect-changes,
        validate-config,
        lint-fast,
        lint,
        test,
        next-state-platform,
        e2e,
        build,
      ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify upstream jobs
        run: |
          results='${{ toJson(needs) }}'
          echo "Upstream job results:"
          echo "$results" | jq '.'

          # `skipped` is treated as success here — it means a job's path
          # filter or `release_please` flag legitimately excluded this PR.
          # `failure` and `cancelled` always fail the aggregator.
          if echo "$results" | jq -e '.[] | select(.result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::At least one upstream job failed or was cancelled"
            exit 1
          fi
          echo "All upstream jobs passed or were appropriately skipped — CI green."
