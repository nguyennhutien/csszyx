name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0 || true

      # See ci.yml — pre-install wasm-bindgen-cli so the @csszyx/core
      # build script (wasm-pack --mode no-install) can skip wasm-pack's
      # own install step. wasm-opt runs via the build script's
      # run-wasm-opt.mjs using the apt-installed binaryen from the next
      # step, so turbo caches the OPTIMIZED pkg/ output.
      - name: Cache wasm-bindgen-cli
        id: cache-wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.93-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.93 --locked

      - name: Install binaryen (for wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wasm-opt runs inside this step via packages/core/scripts/run-wasm-opt.mjs
      # so the OPTIMIZED pkg/ is what turbo captures in its cache. Doing it
      # outside this step would be overwritten whenever turbo had a cache hit.
      # Requires the apt binaryen install step above to provide wasm-opt.
      - name: Build WASM core
        run: pnpm --filter @csszyx/core build

      - name: Build
        run: pnpm build

      - name: Setup npm auth
        run: echo "//registry.npmjs.org/:_authToken=\${NPM_TOKEN}" > ~/.npmrc
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm changeset publish
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: steps.changesets.outputs.published == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(echo '${{ steps.changesets.outputs.publishedPackages }}' \
            | jq -r '.[] | select(.name == "csszyx") | .version')
          [ -z "$VERSION" ] && echo "csszyx not in published set, skipping" && exit 0

          NOTES=$(awk "/^## $VERSION/{flag=1; next} /^## /{if(flag) exit} flag" \
            packages/csszyx/CHANGELOG.md)

          gh release create "v$VERSION" \
            --title "csszyx v$VERSION" \
            --notes "$NOTES"
