name: Release

on:
  push:
    branches:
      - main
  # Manual trigger — used to recover from cases where release-please opened
  # a release PR but its post-merge tagging step failed (e.g. PR title pattern
  # mismatch left `releases_created` unset). Operator runs `gh workflow run
  # release.yml` after manually creating the missing tag + GitHub release; the
  # publish job below will then run with the package.json versions already on
  # main.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # id-token: write is required so `npm publish --provenance` can mint a
  # short-lived OIDC token from the runner. Without it, provenance claims
  # silently disappear from the published tarballs.
  id-token: write

jobs:
  # release-please reads conventional-commit history since the last release
  # and opens (or updates) a "release PR" with version bumps + CHANGELOG
  # entries. When that PR is merged, this job runs again and creates
  # per-package tags plus a single GitHub Release for the umbrella `csszyx`
  # package — non-csszyx packages have skip-github-release: true in the
  # config so they only get tags, not Releases.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      recovered: ${{ steps.recovery.outputs.recovered }}
    steps:
      # ── Phase A: split action into two commands so each phase runs
      # independently. The combined mode (no `command:` input) has a
      # well-known v4 bug in single-root manifest configs: when the
      # post-merge tagging logic detects an `autorelease: pending`
      # PR but cannot resolve the component name (`PR component:
      # undefined does not match configured component: csszyx`), the
      # entire run aborts before tagging — leaving manifest +
      # CHANGELOG already updated but no tag / release / npm
      # publish. Running `release-pr` and `github-release` as
      # separate steps isolates the two responsibilities; the
      # github-release step can still succeed when release-pr is a
      # no-op, and vice versa.
      - name: Release-please — open or update release PR
        uses: googleapis/release-please-action@v4
        id: release-pr
        with:
          command: release-pr
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Release-please — tag merged release PR + create GitHub release
        uses: googleapis/release-please-action@v4
        id: release
        with:
          command: github-release
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Phase B: defensive recovery. If the github-release step
      # above hit the v4 abort bug, the merged release PR keeps its
      # `autorelease: pending` label and no v{version} tag/release
      # exists. This step scans for that exact stuck state and
      # repairs it inline: create the tag pointing at the merge
      # commit, create the GitHub release (notes auto-generated
      # from commits since the previous tag), and flip the label
      # to `autorelease: tagged`. Idempotent — if release-please
      # already succeeded the loop finds zero pending PRs and
      # produces `recovered=0` (no-op).
      - name: Recover stuck autorelease:pending release PRs
        id: recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          recovered=0
          # `gh pr list` with --search supports the same query language as the
          # GitHub UI search box. is:merged is implied by --state merged.
          gh pr list --state merged \
            --search 'label:"autorelease: pending"' \
            --json number,mergeCommit,title \
            --jq '.[] | "\(.number)\t\(.mergeCommit.oid)\t\(.title)"' \
            > /tmp/pending-prs.tsv
          while IFS=$'\t' read -r num sha title; do
            [ -z "${num:-}" ] && continue
            version="$(printf '%s' "$title" | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
            # Fallback: read version from manifest at the merge commit
            if [ -z "${version:-}" ]; then
              version="$(gh api "repos/${GH_REPO}/contents/.release-please-manifest.json?ref=${sha}" \
                --jq '.content' 2>/dev/null \
                | base64 -d 2>/dev/null \
                | grep -oP '"\."\s*:\s*"\K[0-9]+\.[0-9]+\.[0-9]+' \
                | head -1 || true)"
            fi
            if [ -z "${version:-}" ]; then
              echo "::warning::Skipping PR #${num} — no version found in title or manifest: ${title}"
              continue
            fi
            if gh release view "v${version}" >/dev/null 2>&1; then
              echo "Release v${version} already exists for PR #${num} — only flipping label"
            else
              echo "Recovering v${version} from PR #${num} (merge commit ${sha})..."
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                --field "ref=refs/tags/v${version}" \
                --field "sha=${sha}" > /dev/null
              gh release create "v${version}" \
                --title "v${version}" \
                --generate-notes > /dev/null
              recovered=$((recovered + 1))
            fi
            gh pr edit "${num}" \
              --remove-label "autorelease: pending" \
              --add-label "autorelease: tagged" > /dev/null || true
          done < /tmp/pending-prs.tsv
          rm -f /tmp/pending-prs.tsv
          echo "recovered=${recovered}" >> "$GITHUB_OUTPUT"
          echo "Recovery complete — ${recovered} release(s) repaired."

  build-native-artifacts:
    name: Build native package artifacts
    needs: release-please
    if: |
      needs.release-please.outputs.releases_created == 'true' ||
      (needs.release-please.outputs.recovered != '' && needs.release-please.outputs.recovered != '0') ||
      github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            cross: false
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            platform: linux-x64-musl
            cross: true
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            cross: true
          - runner: ubuntu-latest
            target: aarch64-unknown-linux-musl
            platform: linux-arm64-musl
            cross: true
          - runner: macos-13
            target: x86_64-apple-darwin
            platform: darwin-x64
            cross: false
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            cross: false
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            cross: false
          - runner: windows-latest
            target: aarch64-pc-windows-msvc
            platform: win32-arm64-msvc
            cross: false
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: ${{ matrix.target }}

      - name: Install zig (cross-compile)
        if: matrix.cross
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build native package
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PWD/node_modules/.bin:$PWD/packages/core/node_modules/.bin:$PATH"
          cd packages/core
          node scripts/build-native.mjs \
            --release --clean --native-engine \
            --target "${{ matrix.target }}" \
            ${{ matrix.cross && '--cross-compile' || '' }}
          cd ../..
          mkdir -p "native-artifacts/packages/core-${{ matrix.platform }}"
          cp \
            "packages/core-${{ matrix.platform }}/csszyx-core.${{ matrix.platform }}.node" \
            "native-artifacts/packages/core-${{ matrix.platform }}/"

      - name: Upload native package artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: native-artifacts/packages
          if-no-files-found: error

  # Runs only when release-please created releases (i.e. the release PR was
  # just merged). Builds the workspace and publishes to npm. Per-package
  # tags created by release-please (e.g. @csszyx/vscode-0.6.0) will
  # separately trigger release-vscode.yml for Marketplace publish.
  publish:
    name: Publish to npm
    needs: [release-please, build-native-artifacts]
    # Runs when:
    #   - release-please just minted a release (normal flow), OR
    #   - the recovery step (Phase B above) tagged a stuck pending PR, OR
    #   - an operator manually dispatches the workflow (tag/release already
    #     exist via manual `gh` calls, package.json versions on main are
    #     correct, just need to run pnpm publish).
    if: |
      needs.release-please.outputs.releases_created == 'true' ||
      (needs.release-please.outputs.recovered != '' && needs.release-please.outputs.recovered != '0') ||
      github.event_name == 'workflow_dispatch'
    # `npm-publish` environment holds NPM_TOKEN and requires a maintainer
    # review before the job runs. Even if a malicious workflow change
    # reaches main, the publish step pauses until @nguyennhutien approves
    # via the GitHub Actions deployment-review prompt.
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Inherit id-token: write at the job level so the OIDC issuer reachable
      # from inside `npm publish --provenance`. The job-level read default
      # would otherwise drop the workflow-level grant.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0 || true

      # Pre-install wasm-bindgen-cli so the @csszyx/core build script
      # (wasm-pack --mode no-install) can skip wasm-pack's own install step.
      - name: Cache wasm-bindgen-cli
        id: cache-wasm-bindgen
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.93-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.93 --locked

      - name: Install binaryen (for wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate native package metadata
        run: pnpm --filter @csszyx/core native:packages

      - name: Download native package artifacts
        uses: actions/download-artifact@v4
        with:
          path: .
          pattern: native-*
          merge-multiple: true

      - name: Validate native package binaries
        run: pnpm --filter @csszyx/core native:packages -- --require-binaries

      # wasm-opt runs inside this step via packages/core/scripts/run-wasm-opt.mjs
      # so the OPTIMIZED pkg/ is what turbo captures in its cache.
      - name: Build WASM core
        run: pnpm --filter @csszyx/core build

      - name: Build all packages
        run: pnpm build

      # pnpm respects `private: true` so vscode + adapters + mcp-server are
      # automatically skipped. --no-git-checks bypasses pnpm's interactive
      # branch confirmation prompt.
      #
      # --provenance binds each tarball to this commit + workflow run via an
      # OIDC-signed attestation. npm shows a "Built and signed" badge on the
      # package page and `npm audit signatures` can verify offline. Free
      # supply-chain hardening — only requires id-token: write (set above).
      - name: Publish to npm with provenance
        run: pnpm -r publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
