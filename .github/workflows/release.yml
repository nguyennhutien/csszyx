name: Release

on:
  push:
    branches:
      - main
  # Manual trigger — used to recover from cases where release-please opened
  # a release PR but its post-merge tagging step failed (e.g. PR title pattern
  # mismatch left `releases_created` unset). Operator runs `gh workflow run
  # release.yml` after manually creating the missing tag + GitHub release; the
  # publish job below will then run with the package.json versions already on
  # main.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Dispatch release-vscode.yml after a release is cut. Tags minted by
  # release-please carry GITHUB_TOKEN identity, and GitHub never fires
  # workflows from events created with a workflow's own token — so the
  # extension's `on: push: tags` trigger has been dead since the v5
  # upgrade. An explicit workflow_dispatch API call is exempt from that
  # anti-recursion rule.
  actions: write

jobs:
  # release-please reads conventional-commit history since the last release
  # and opens (or updates) a "release PR" with version bumps + CHANGELOG
  # entries. When that PR is merged, this job runs again and creates
  # per-package tags plus a single GitHub Release for the umbrella `csszyx`
  # package — non-csszyx packages have skip-github-release: true in the
  # config so they only get tags, not Releases.
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      releases_created: ${{ steps.release.outputs.releases_created }}
      recovered: ${{ steps.recovery.outputs.recovered }}
    steps:
      # Checkout so the enrich step below can run scripts/ and read the config.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # v5 removed the `command` input — the action runs both release-pr
      # and github-release in a single invocation automatically.
      - name: Release Please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Phase B: defensive recovery. If the github-release step
      # above hit the v4 abort bug, the merged release PR keeps its
      # `autorelease: pending` label and no v{version} tag/release
      # exists. This step scans for that exact stuck state and
      # repairs it inline: create the tag pointing at the merge
      # commit, create the GitHub release (notes auto-generated
      # from commits since the previous tag), and flip the label
      # to `autorelease: tagged`. Idempotent — if release-please
      # already succeeded the loop finds zero pending PRs and
      # produces `recovered=0` (no-op).
      - name: Recover stuck autorelease:pending release PRs
        id: recovery
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          recovered=0
          # `gh pr list` with --search supports the same query language as the
          # GitHub UI search box. is:merged is implied by --state merged.
          gh pr list --state merged \
            --search 'label:"autorelease: pending"' \
            --json number,mergeCommit,title \
            --jq '.[] | "\(.number)\t\(.mergeCommit.oid)\t\(.title)"' \
            > /tmp/pending-prs.tsv
          while IFS=$'\t' read -r num sha title; do
            [ -z "${num:-}" ] && continue
            version="$(printf '%s' "$title" | grep -oP 'v\K[0-9]+\.[0-9]+\.[0-9]+' | head -1 || true)"
            # Fallback: read version from manifest at the merge commit
            if [ -z "${version:-}" ]; then
              version="$(gh api "repos/${GH_REPO}/contents/.release-please-manifest.json?ref=${sha}" \
                --jq '.content' 2>/dev/null \
                | base64 -d 2>/dev/null \
                | grep -oP '"\."\s*:\s*"\K[0-9]+\.[0-9]+\.[0-9]+' \
                | head -1 || true)"
            fi
            if [ -z "${version:-}" ]; then
              echo "::warning::Skipping PR #${num} — no version found in title or manifest: ${title}"
              continue
            fi
            if gh release view "v${version}" >/dev/null 2>&1; then
              echo "Release v${version} already exists for PR #${num} — only flipping label"
            else
              echo "Recovering v${version} from PR #${num} (merge commit ${sha})..."
              gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
                --field "ref=refs/tags/v${version}" \
                --field "sha=${sha}" > /dev/null
              # Prefer the CHANGELOG section for this version (rich + consistent
              # with the file) over GitHub's PR-list auto-notes. Fetch via the
              # API (no checkout needed) and fall back to --generate-notes if the
              # section is missing.
              gh api "repos/${GH_REPO}/contents/packages/csszyx/CHANGELOG.md?ref=${sha}" \
                --jq '.content' 2>/dev/null | base64 -d > /tmp/changelog-full.md || true
              awk -v ver="$version" \
                'index($0, "## ["ver"]") == 1 { p=1; print; next } p && /^## \[/ { exit } p { print }' \
                /tmp/changelog-full.md > /tmp/release-notes.md || true
              if [ -s /tmp/release-notes.md ]; then
                gh release create "v${version}" --title "v${version}" \
                  --notes-file /tmp/release-notes.md > /dev/null
              else
                gh release create "v${version}" --title "v${version}" \
                  --generate-notes > /dev/null
              fi
              recovered=$((recovered + 1))
            fi
            gh pr edit "${num}" \
              --remove-label "autorelease: pending" \
              --add-label "autorelease: tagged" > /dev/null || true
          done < /tmp/pending-prs.tsv
          rm -f /tmp/pending-prs.tsv
          echo "recovered=${recovered}" >> "$GITHUB_OUTPUT"
          echo "Recovery complete — ${recovered} release(s) repaired."

      # When release-please has only opened/updated a release PR (no release cut
      # yet), rebuild that PR's CHANGELOG section from the squash commit bodies so
      # a bundled PR still yields rich, grouped notes (release-please only reads
      # the squash subject). Best-effort: the script never throws and the step is
      # continue-on-error, so a failure leaves the thin release-please output.
      - name: Enrich release PR CHANGELOG from squash commits
        if: ${{ steps.release.outputs.releases_created != 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/enrich-release-changelog.mjs

      # Chain the VS Code Marketplace publish. The tags release-please creates
      # carry this workflow's GITHUB_TOKEN, and GitHub never triggers workflows
      # from events made with a workflow's own token — Marketplace publishes
      # went silent from v0.9.1 until this dispatch was added. An explicit
      # workflow_dispatch API call is exempt from that rule; the dispatched
      # job still pauses on the `vscode-publish` environment for maintainer
      # approval (same gate model as npm-publish), so this only STARTS the
      # run, it cannot publish anything by itself. Mirrors the npm publish
      # condition: a fresh release, or tags repaired by the recovery step.
      #
      # The dispatch runs on main, NOT the release tag: the vscode-publish
      # environment's deployment policy only allows main, so a tag-ref run is
      # rejected by protection rules before its first step (broke every
      # extension release v0.11.4–v0.11.8). This job runs on the release-PR
      # merge commit, so main here IS the released commit; the extension
      # version is read from packages/vscode/package.json, which release-please
      # has already bumped.
      - name: Dispatch VS Code Marketplace publish
        if: >-
          steps.release.outputs.releases_created == 'true' ||
          (steps.recovery.outputs.recovered != '' && steps.recovery.outputs.recovered != '0')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Dispatching release-vscode.yml on main"
          gh workflow run release-vscode.yml --ref main

  build-native-artifacts:
    needs: release-please
    if: |
      needs.release-please.outputs.releases_created == 'true' ||
      (needs.release-please.outputs.recovered != '' && needs.release-please.outputs.recovered != '0') ||
      github.event_name == 'workflow_dispatch'
    # Builds the eight binaries and loads each one where a runner can run it;
    # the same workflow runs on pull requests that touch the release path.
    permissions:
      contents: read
    uses: ./.github/workflows/native-artifacts.yml

  # Runs only when release-please created releases (i.e. the release PR was
  # just merged). Builds the workspace and publishes to npm. The Marketplace
  # publish for @csszyx/vscode is chained by the explicit dispatch step in
  # the release-please job above — bot-created tags cannot trigger
  # release-vscode.yml on their own.
  publish:
    name: Publish to npm
    needs: [release-please, build-native-artifacts]
    # Runs when:
    #   - release-please just minted a release (normal flow), OR
    #   - the recovery step (Phase B above) tagged a stuck pending PR, OR
    #   - an operator manually dispatches the workflow (tag/release already
    #     exist via manual `gh` calls, package.json versions on main are
    #     correct, just need to run pnpm publish).
    if: |
      needs.release-please.outputs.releases_created == 'true' ||
      (needs.release-please.outputs.recovered != '' && needs.release-please.outputs.recovered != '0') ||
      github.event_name == 'workflow_dispatch'
    # `npm-publish` requires a maintainer review before the job runs. Even if a
    # malicious workflow change reaches main, the publish step pauses until
    # @nguyennhutien approves via the GitHub Actions deployment-review prompt.
    environment: npm-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Mint the short-lived OIDC token Sigstore uses to sign the npm
      # provenance attestation (the "verified" badge on each published
      # version). Required whenever NPM_CONFIG_PROVENANCE is set below.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      # Build with wasm-opt, place the binaries the build jobs uploaded, and
      # test those bytes. release-dry-run.yml runs the same action on pull
      # requests.
      - name: Build and test the release bytes
        uses: ./.github/actions/release-bytes

      # Publish one package at a time in workspace dependency order. The
      # script verifies exact immutable versions before each publish, so a
      # workflow_dispatch can safely resume a release that stopped halfway.
      # Transient registry conflicts are retried and the job only succeeds
      # after every public workspace version is visible on npm.
      #
      # --provenance is enabled (publish-workspace.mjs): every public workspace
      # package has been published at least once, so the first-publish E404 that
      # blocked OIDC attestation no longer applies. Each release now ships a
      # signed provenance attestation (id-token: write + NPM_CONFIG_PROVENANCE).
      - name: Publish to npm
        run: node .github/scripts/publish-workspace.mjs
        env:
          # `@csszyx/core`'s prepublishOnly builds its wasm again; this keeps
          # that build from skipping wasm-opt, so npm gets the bytes the step
          # above tested.
          CSSZYX_REQUIRE_WASM_OPT: "1"
          # Every public package demonstrated trusted publishing in the 0.14.0
          # release. Refuse a token fallback so a deleted or drifted npm trusted
          # publisher fails visibly instead of reviving long-lived credentials.
          CSSZYX_REQUIRE_OIDC: "1"
          # Attach a signed provenance attestation to each published package
          # (npm + pnpm both honour this config). Pairs with id-token: write
          # above; the publish fails closed if the OIDC token is unavailable.
          NPM_CONFIG_PROVENANCE: "true"
