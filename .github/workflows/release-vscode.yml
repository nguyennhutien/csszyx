name: Release VS Code Extension

# Decoupled from npm release because:
#   - Different registry (Marketplace) and credential (VSCE_PAT, not NPM_TOKEN)
#   - Different artifact (.vsix, not tarball)
#   - @csszyx/vscode is `private: true` in package.json so npm publish
#     auto-skips it. Marketplace publish therefore needs its own trigger.
#
# Auto-trigger: the release-please job in release.yml dispatches this
# workflow explicitly after cutting a release. A `detect` job then diffs the
# extension against the previous release tag and SKIPS the publish when only
# the release-please version bump changed, so a release that does not touch the
# extension does not rebuild or re-request Marketplace approval. The `v*` tag trigger below
# is kept as a manual belt-and-braces path, but it CANNOT fire for normal
# releases: release-please creates tags with the workflow's GITHUB_TOKEN,
# and GitHub never triggers workflows from events made with a workflow's
# own token (Marketplace publishes were silently skipped from v0.9.1
# until the explicit dispatch was added). Either way the publish job
# pauses on the `vscode-publish` environment for maintainer approval
# before any Marketplace API call. The version itself is read from
# packages/vscode/package.json — extra-files keeps that field in sync
# with every release.
#
# Manual trigger: workflow_dispatch with optional dry_run (build .vsix
# without publishing) for verification. A real publish via dispatch is
# possible but, like the tag path, waits for environment approval.
#
# The VSCE_PAT secret must be set in repo settings (Azure DevOps PAT with
# Marketplace publish scope). The `vscode-publish` environment must exist
# in repo Settings → Environments with a required reviewer — the YAML
# reference alone does not gate anything without it.

on:
  push:
    tags:
      # Single-root release-please tag format (include-component-in-tag:
      # false, include-v-in-tag: true) — e.g. v0.6.2, v0.7.0.
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build .vsix without publishing'
        required: false
        default: 'false'
      force:
        description: 'Publish even if the extension is unchanged since the last release'
        required: false
        default: 'false'

concurrency:
  group: release-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # release.yml dispatches this workflow after EVERY release, but most releases
  # do not touch the extension (release-please only bumps its version via
  # extra-files). Detect whether the extension actually changed since the last
  # release so the publish job below is SKIPPED on a version-only bump — no
  # wasted build and no dangling `vscode-publish` approval request. A manual
  # `force` dispatch bypasses the gate.
  detect:
    name: Detect extension changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history + tags so the detector can diff against the previous
          # release tag.
          fetch-depth: 0
      - name: Detect VS Code extension changes since the last release
        id: check
        run: |
          changed="$(node scripts/vscode-extension-changed.mjs)"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "VS Code extension changed since last release: ${changed}"

  publish:
    name: Build and publish to Marketplace
    needs: detect
    # Skip a version-only bump; a manual force dispatch always publishes.
    if: needs.detect.outputs.changed == 'true' || github.event.inputs.force == 'true'
    runs-on: ubuntu-latest
    # Holds the job until a maintainer approves the deployment, the same
    # gate as the npm `npm-publish` environment. Closes the path where a
    # workflow_dispatch (default dry_run='false') would publish unattended.
    environment: vscode-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        # Build only the JavaScript dependencies the extension bundles —
        # @csszyx/tooling-metadata (whose dist/ is gitignored, so esbuild can
        # only resolve it once built) and @csszyx/ts-plugin (packed into the
        # vsix). NOT `@csszyx/vscode...`: the full dependency graph pulls in
        # @csszyx/core, whose build runs wasm-pack, and this runner has no Rust
        # toolchain. pnpm builds the three in dependency order.
        run: >-
          pnpm --filter @csszyx/tooling-metadata --filter @csszyx/ts-plugin
          --filter @csszyx/vscode build

      - name: Package .vsix (dry-run check)
        run: pnpm --filter @csszyx/vscode vsix
        env:
          # `vsix` runs scripts/package.mjs without --publish; verifies the
          # bundle is well-formed before any Marketplace API call.
          NODE_ENV: production

      - name: Publish to Marketplace
        if: github.event.inputs.dry_run != 'true'
        run: pnpm --filter @csszyx/vscode vsix:publish
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Read extension version
        id: meta
        # Reading from package.json keeps the workflow agnostic to the
        # tag format. extra-files in release-please-config.json updates
        # packages/vscode/package.json on every release, so this value
        # always matches the just-tagged version (or whatever is on main
        # for workflow_dispatch runs).
        run: echo "version=$(node -p "require('./packages/vscode/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: csszyx-vscode-${{ steps.meta.outputs.version }}
          path: packages/vscode/*.vsix
          retention-days: 90
