name: Release VS Code Extension

# Decoupled from npm release because:
#   - Different registry (Marketplace) and credential (VSCE_PAT, not NPM_TOKEN)
#   - Different artifact (.vsix, not tarball)
#   - @csszyx/vscode is `private: true` in package.json so npm publish
#     auto-skips it. Marketplace publish therefore needs its own trigger.
#
# Auto-trigger: the release-please job in release.yml dispatches this
# workflow on `main` after cutting a release. A `detect` job then diffs the
# extension against the previous release tag and SKIPS the publish when only
# the release-please version bump changed, so a release that does not touch the
# extension does not rebuild or re-request Marketplace approval. The publish
# job pauses on the `vscode-publish` environment for maintainer approval
# before any Marketplace API call. The version itself is read from
# packages/vscode/package.json — extra-files keeps that field in sync
# with every release.
#
# main-only: the vscode-publish environment's deployment policy allows only
# the main branch, so the publish job additionally guards on `main` and
# SKIPS any other ref instead of reaching the environment and dying red on
# protection rules. That rejection is exactly what broke every extension
# release from v0.11.4 to v0.11.8, when the dispatch still targeted the
# release tag. There is no `v*` tag trigger for the same reason — and it
# could never fire for normal releases anyway: release-please creates tags
# with the workflow's GITHUB_TOKEN, and GitHub never triggers workflows
# from events made with a workflow's own token (Marketplace publishes were
# silently skipped from v0.9.1 until the explicit dispatch was added).
#
# Manual trigger: workflow_dispatch (pick ref main) with optional dry_run
# (build .vsix without publishing) for verification. A real publish via
# dispatch is possible but waits for the same environment approval.
#
# Authentication (two paths; the workflow prefers Entra ID when configured):
#
#   1. Microsoft Entra ID (OIDC, recommended — global PATs retire 2026-12-01).
#      One-time setup:
#        a. Entra ID → App registrations → new app; note Application (client) ID
#           and Directory (tenant) ID.
#        b. That app → Certificates & secrets → Federated credentials → Add →
#           GitHub Actions: org `nguyennhutien`, repo `csszyx`, entity
#           Environment, name `vscode-publish`. (Subject resolves to
#           `repo:nguyennhutien/csszyx:environment:vscode-publish`.)
#        c. https://marketplace.visualstudio.com/manage → publisher `csszyx` →
#           add the app as a member (role Contributor). This is the step that,
#           if skipped, yields vsce "not allowed"/"corporate credentials" errors.
#           Verify with `vsce verify-pat csszyx --azure-credential`.
#        d. Repo → Settings → Secrets and variables → Actions → Variables:
#           add AZURE_CLIENT_ID and AZURE_TENANT_ID. Their presence switches
#           this workflow to `vsce publish --azure-credential`; no subscription
#           is required.
#
#   2. Personal Access Token (fallback, used only while AZURE_CLIENT_ID is
#      unset). VSCE_PAT secret = an Azure DevOps PAT scoped to "All accessible
#      organizations" + Marketplace: Manage.
#
# Either way the `vscode-publish` environment must exist in repo Settings →
# Environments with a required reviewer — the YAML reference alone gates
# nothing without it — with a deployment-branch policy allowing `main` (the
# only ref the publish job accepts).

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build .vsix without publishing'
        required: false
        default: 'false'
      force:
        description: 'Publish even if the extension is unchanged since the last release'
        required: false
        default: 'false'

concurrency:
  group: release-vscode-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # release.yml dispatches this workflow after EVERY release, but most releases
  # do not touch the extension (release-please only bumps its version via
  # extra-files). Detect whether the extension actually changed since the last
  # release so the publish job below is SKIPPED on a version-only bump — no
  # wasted build and no dangling `vscode-publish` approval request. A manual
  # `force` dispatch bypasses the gate.
  detect:
    name: Detect extension changes
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history + tags so the detector can diff against the previous
          # release tag.
          fetch-depth: 0
      - name: Detect VS Code extension changes since the last release
        id: check
        run: |
          changed="$(node scripts/vscode-extension-changed.mjs)"
          echo "changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "VS Code extension changed since last release: ${changed}"

  publish:
    name: Build and publish to Marketplace
    needs: detect
    # Skip a version-only bump (a manual force dispatch always publishes) and
    # skip any ref other than main — the vscode-publish environment only
    # allows main, so reaching it from another ref fails the run instead of
    # skipping it.
    if: >-
      github.ref == 'refs/heads/main' &&
      (needs.detect.outputs.changed == 'true' || github.event.inputs.force == 'true')
    runs-on: ubuntu-latest
    # Holds the job until a maintainer approves the deployment, the same
    # gate as the npm `npm-publish` environment. Closes the path where a
    # workflow_dispatch (default dry_run='false') would publish unattended.
    environment: vscode-publish
    permissions:
      contents: read
      # Fetch the GitHub OIDC token so azure/login can exchange it for a
      # short-lived Entra ID token — used only when AZURE_CLIENT_ID is set.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build extension
        # Build only the JavaScript dependencies the extension bundles —
        # @csszyx/tooling-metadata (whose dist/ is gitignored, so esbuild can
        # only resolve it once built) and @csszyx/ts-plugin (packed into the
        # vsix). NOT `@csszyx/vscode...`: the full dependency graph pulls in
        # @csszyx/core, whose build runs wasm-pack, and this runner has no Rust
        # toolchain. pnpm builds the three in dependency order.
        run: >-
          pnpm --filter @csszyx/tooling-metadata --filter @csszyx/ts-plugin
          --filter @csszyx/vscode build

      - name: Package .vsix (dry-run check)
        run: pnpm --filter @csszyx/vscode vsix
        env:
          # `vsix` runs scripts/package.mjs without --publish; verifies the
          # bundle is well-formed before any Marketplace API call.
          NODE_ENV: production

      # Entra ID (OpenID Connect) auth — the path forward as Azure DevOps
      # retires global PATs (Dec 1 2026). Runs only once the AZURE_CLIENT_ID /
      # AZURE_TENANT_ID repository variables exist and the Entra app is a member
      # of the `csszyx` Marketplace publisher; until then the PAT path below
      # still runs, so this migration does not need a flag day. No subscription
      # is needed — the publish wants only a Marketplace-scoped Entra token.
      - name: Azure login (Entra ID, OIDC)
        if: github.event.inputs.dry_run != 'true' && vars.AZURE_CLIENT_ID != ''
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish to Marketplace
        if: github.event.inputs.dry_run != 'true'
        run: pnpm --filter @csszyx/vscode vsix:publish
        env:
          # When the Entra variables are configured, publish with
          # `vsce publish --azure-credential` (it reads the az CLI session the
          # login step established); otherwise fall back to the PAT secret.
          VSCE_AZURE_CREDENTIAL: ${{ vars.AZURE_CLIENT_ID != '' && 'true' || '' }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Read extension version
        id: meta
        # Reading from package.json keeps the workflow agnostic to the
        # tag format. extra-files in release-please-config.json updates
        # packages/vscode/package.json on every release, so this value
        # always matches the just-tagged version (or whatever is on main
        # for workflow_dispatch runs).
        run: echo "version=$(node -p "require('./packages/vscode/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Upload .vsix artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: csszyx-vscode-${{ steps.meta.outputs.version }}
          path: packages/vscode/*.vsix
          retention-days: 90
