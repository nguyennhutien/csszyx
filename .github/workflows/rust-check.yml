name: Rust Check

on:
  push:
    branches: [main, develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/core/**"
      - "rust-toolchain.toml"
      - ".rustfmt.toml"
      - ".mise.toml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/core/**"
      - "rust-toolchain.toml"
      - ".rustfmt.toml"
      - ".mise.toml"

jobs:
  check:
    name: Rust Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.93.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # The crate's only `unsafe` block lives behind `native-engine`, so the
      # default clippy run above never lints it. Run clippy with the feature too
      # so the unsafe-block lints (undocumented_unsafe_blocks etc.) are enforced.
      - name: Run clippy (native-engine)
        run: cargo clippy --features native-engine --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check native feature
        run: node scripts/check-native.mjs

      - name: Validate native package metadata
        run: node scripts/validate-native-packages.mjs

      - name: Run native engine parser tests
        run: cargo test --features native-engine transform::parser

      # The parse-level parity harness is gated behind native-engine and is not
      # matched by the transform::parser filter above, so run it explicitly.
      - name: Run parse-parity harness
        run: cargo test --features native-engine --test parse_parity_corpus

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0 || true

      # See ci.yml — pre-install wasm-bindgen-cli so `--mode no-install`
      # below can skip wasm-pack's own install step (which has a parse
      # bug on repeat invocations).
      - name: Cache wasm-bindgen-cli
        id: cache-wasm-bindgen
        uses: actions/cache@v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.93-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.93 --locked

      - name: Build WASM
        run: wasm-pack build --mode no-install --target bundler
