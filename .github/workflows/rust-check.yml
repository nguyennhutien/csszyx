name: Rust Check

on:
  push:
    branches: [main, develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/core/**"
      - "rust-toolchain.toml"
      - ".rustfmt.toml"
      - ".mise.toml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "packages/core/**"
      - "rust-toolchain.toml"
      - ".rustfmt.toml"
      - ".mise.toml"

# Nothing here writes: it checks out, installs and runs checks. Said in the file
# rather than left to the repository setting, which is `read` today and is one
# click away from not being.
permissions:
  contents: read

jobs:
  check:
    name: Rust Check
    # Skip a release-please change: its only edits are version + CHANGELOG bumps,
    # and the bump to packages/core/package.json matches this workflow's
    # `packages/core/**` path filter — so without this gate a version-only release
    # PR (and its merge commit) runs the whole Rust suite + native/WASM build for
    # nothing. Two signals mirror ci.yml's detection: the PR's head_ref on the
    # release-please branch, and the release commit subject on the merge push
    # (where head_ref is empty). The broad path filter is deliberately left
    # unchanged so EVERY real Rust-relevant change still runs the full check.
    if: >-
      ${{ !startsWith(github.head_ref, 'release-please--branches--main')
      && !startsWith(github.event.head_commit.message, 'chore(main): release ')
      && !startsWith(github.event.head_commit.message, 'chore: release ') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # The crate's only `unsafe` block lives behind `native-engine`, so the
      # default clippy run above never lints it. Run clippy with the feature too
      # so the unsafe-block lints (undocumented_unsafe_blocks etc.) are enforced.
      - name: Run clippy (native-engine, migrate)
        run: cargo clippy --features native-engine,migrate --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

      - name: Check native feature
        run: node scripts/check-native.mjs

      - name: Validate native package metadata
        run: node scripts/validate-native-packages.mjs

      # Everything behind the native-engine gate: inline module tests (parser,
      # lower, rewrite, engine, szv_precompile, …) AND every integration binary
      # (parity corpuses, sz_fallback_parity, parser_panic_fuzz). The previous
      # shape filtered by `transform::parser` plus one named binary, which
      # silently skipped every other gated test — 157 lines of fallback parity
      # assertions ran zero times here while the job stayed green.
      - name: Run native engine and migrate tests
        run: cargo test --features native-engine,migrate

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.14.0 || true

      # See ci.yml — pre-install wasm-bindgen-cli so `--mode no-install`
      # below can skip wasm-pack's own install step (which has a parse
      # bug on repeat invocations).
      - name: Cache wasm-bindgen-cli
        id: cache-wasm-bindgen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-0.2.93-${{ runner.os }}
      - name: Install wasm-bindgen-cli
        if: steps.cache-wasm-bindgen.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.93 --locked

      - name: Build WASM
        run: wasm-pack build --mode no-install --target bundler

  # Mutation testing on the lines this pull request changed.
  #
  # Codecov's patch gate proves a changed line RAN under test. It cannot prove
  # the test would go RED if the line were wrong, and a loose assertion scores
  # 100% patch coverage while catching nothing. This closes that gap where it
  # is cheap: only the added lines are mutated, so a run costs minutes instead
  # of the hours the full sweep needs, and the answer arrives while the change
  # is still open.
  #
  # The monthly sweep in mutation.yml stays for what a diff cannot see: a
  # change that breaks code it never edits.
  #
  # Known cost: a mutant that breaks a loop counter never terminates, and in a
  # loop that allocates it can demand tens of GB before the timeout fires. That
  # only happens when a pull request touches one of the hand-written byte
  # scanners. --timeout-multiplier bounds the window relative to the measured
  # baseline rather than pinning an absolute that would drift with runner speed.
  #
  # Sharded because the budget is per pull request, not per line: a change that
  # adds a module rather than editing one produces mutants in proportion to its
  # size. The port of migrate generated 697 against a 45-minute ceiling sized
  # for ordinary diffs, and hit the ceiling with most of them unrun. Raising the
  # ceiling only moves the wall and lengthens the feedback loop; splitting the
  # work keeps a shard near the ordinary case and leaves room above it.
  mutate-diff:
    name: Mutation (changed lines)
    if: >-
      ${{ github.event_name == 'pull_request'
      && !startsWith(github.head_ref, 'release-please--branches--main') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      # The shard belongs in the group. A job-level concurrency group is shared
      # by every matrix instance, so without it the shards cancel each other
      # and the run reports on whichever one happened to start last.
      group: mutate-diff-${{ github.event.pull_request.number }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      # One shard timing out still leaves three real results, and cancelling
      # them would turn a partial answer into none.
      fail-fast: false
      matrix:
        # cargo-mutants numbers shards from ZERO: --shard k/n requires k < n,
        # so a one-based list would spend a job on an invalid 4/4 and never ask
        # for slice 0/4 at all.
        shard: [0, 1, 2, 3]
    steps:
      # Full history: the wrapper scopes the run with `git merge-base HEAD main`
      # and a shallow clone has no merge base to find.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # checkout leaves main as a remote ref only, and the wrapper names it
      # locally. Non-fatal: without it the wrapper exits saying so.
      - name: Make main resolvable
        run: git fetch --no-tags origin main:main || true

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.toml') }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-mutants

      # --features is spelled out rather than left to .cargo/mutants.toml: the
      # engine only exists behind native-engine, and without it every mutant
      # lands in a crate whose transform module is compiled out and reports back
      # as unviable — a green run that measured nothing.
      #
      # migrate is named too, and it is the more dangerous omission. It is a
      # separate feature on purpose, so a run without it compiles the migrate
      # module out — and a mutant in code that is not compiled builds fine and
      # passes every test, which reports as MISSED rather than unviable. That
      # reads as a weak suite instead of a run that measured nothing, and sends
      # whoever acts on it to write tests for lines that already have them.
      # Measured on one mutant: "replace == with != in is_word_char" is MISSED
      # under native-engine alone and CAUGHT under native-engine,migrate.
      - name: Mutate the diff
        run: >-
          bash scripts/mutants.sh diff
          --features native-engine,migrate
          --shard ${{ matrix.shard }}/4
          --timeout-multiplier 3
          --minimum-test-timeout 30
