name: Rust Check

on:
  push:
    branches: [main, develop]
    paths:
      - "packages/core/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "packages/core/**"

jobs:
  check:
    name: Rust Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/core
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            packages/core/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all-features

      - name: Install wasm-pack
        # Pin to 0.12.1 — see ci.yml comment for rationale.
        run: cargo install wasm-pack --locked --version 0.12.1 || true

      # See ci.yml — cache wasm-bindgen CLI download. wasm-opt is disabled
      # in packages/core/Cargo.toml; release.yml handles size optimization.
      - name: Cache wasm-pack tool downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/wasm-pack
          key: wasm-pack-tools-${{ runner.os }}-v1

      - name: Build WASM
        run: wasm-pack build --target bundler
