# Security scanning — runs on every PR and weekly on main.
#
# Three layers, zero cost for public repos:
#
# 1. CodeQL: semantic static analysis for JS/TS. Catches command injection,
#    path traversal, XSS, prototype pollution, regex injection, and other
#    data-flow vulnerabilities that pattern-match linters miss.
#
# 2. npm audit: checks JS dependency tree for known CVEs.
#
# 3. cargo audit: checks Rust dependency tree for known advisories.
#
# Findings appear as inline annotations on the PR diff (CodeQL) or as
# job failures (audit commands). No AI, no tokens, no third-party accounts.

name: Security

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/release.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/rust-check.yml"
      - ".agent/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - ".github/workflows/release.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/rust-check.yml"
      - ".agent/**"
      - "docs/**"
      - "**/*.md"
  schedule:
    # Weekly Monday 06:00 UTC — catches new advisories on deps that
    # haven't changed (no PR trigger for those).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      # Diff-informed analysis (default on) restricts PR results to lines in
      # the PR diff, so a change that creates an alert elsewhere (new taint
      # flow, shifted fingerprint) only surfaces after merging to main.
      # Full analysis uploads every result; GitHub still compares against the
      # base branch, so the PR check only flags alerts new to the PR.
      CODEQL_ACTION_DIFF_INFORMED_QUERIES: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
          # Default query suite covers security + quality. For security-only
          # (fewer findings, higher signal), use:
          #   queries: security-extended
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: "/language:javascript-typescript"

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    # 15, the budget CodeQL and semgrep already have, because the steps before
    # the audit are the ones that run long. `pnpm/action-setup` fetches pnpm
    # over the network and stalls intermittently on the runners: measured in
    # one CI run, "Setup pnpm" took 10-14s in four jobs and 424s and 438s in
    # two others, which passed only because their budget is 30 and 45 minutes.
    # At 5 this job was the only one in the repository a stall could kill, and
    # it died before reaching the command it exists to run. A real advisory
    # still fails it in seconds.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The gate runs `pnpm audit --audit-level high --ignore-unfixable` and
      # tells its two failures apart: an advisory in the tree, and an advisory
      # service that could not be reached. Both exit non-zero, and read from
      # the Checks tab they were the same red tick.
      - name: Audit JS dependencies
        run: |
          node --test scripts/npm-audit-gate.test.mjs
          node scripts/npm-audit-gate.mjs

  # A second, independent answer to "does this pull request add a dependency
  # with a known advisory", read from GitHub's own dependency graph and
  # advisory database rather than from `registry.npmjs.org`. It survives an
  # npm outage, which the job above does not: on 2026-09-04 the advisory
  # endpoint answered a GET in 0.4s and hung on every POST for hours
  # (npm/cli#9950), and `pnpm audit` had nothing to report from.
  #
  # It does not replace that job, and the difference is the reason both are
  # here. This one reviews what a pull request CHANGES: measured against this
  # repository, a range that touches no dependency returns zero entries. An
  # advisory published today against a dependency nobody touched is invisible
  # to it, and catching those is what the weekly `npm audit` run exists for.
  #
  # Pull requests only, because a diff of dependencies needs two sides.
  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # Same budget for the same reason, and this one builds `cargo-audit` from
    # source first: 3m11s on a good day, against a 5-minute cap.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history so the scan covers every commit, not just the diff.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          # Built-in token; no license/secret needed for a public repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pip install semgrep

      # Blocking: only the ERROR-severity custom rules (verified clean against
      # the current tree). The WARNING/heuristic rules run informationally below.
      - name: Custom rules (blocking)
        run: semgrep scan --config rules/ --severity ERROR --error --metrics=off

      # Informational: full custom set + registry rulesets. continue-on-error so
      # pre-existing registry findings surface as annotations without breaking
      # the build until a baseline is triaged.
      - name: Custom + registry rulesets (informational)
        continue-on-error: true
        run: >
          semgrep scan
          --config rules/
          --config p/javascript
          --config p/typescript
          --config p/react
          --config p/owasp-top-ten
          --config p/secrets
          --metrics=off
