# Security scanning — runs on every PR and weekly on main.
#
# Three layers, zero cost for public repos:
#
# 1. CodeQL: semantic static analysis for JS/TS. Catches command injection,
#    path traversal, XSS, prototype pollution, regex injection, and other
#    data-flow vulnerabilities that pattern-match linters miss.
#
# 2. npm audit: checks JS dependency tree for known CVEs.
#
# 3. cargo audit: checks Rust dependency tree for known advisories.
#
# Findings appear as inline annotations on the PR diff (CodeQL) or as
# job failures (audit commands). No AI, no tokens, no third-party accounts.

name: Security

on:
  push:
    branches: [main]
    paths-ignore:
      - ".github/workflows/release.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/rust-check.yml"
      - ".agent/**"
      - "docs/**"
      - "**/*.md"
  pull_request:
    branches: [main, develop]
    paths-ignore:
      - ".github/workflows/release.yml"
      - ".github/workflows/ci.yml"
      - ".github/workflows/rust-check.yml"
      - ".agent/**"
      - "docs/**"
      - "**/*.md"
  schedule:
    # Weekly Monday 06:00 UTC — catches new advisories on deps that
    # haven't changed (no PR trigger for those).
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          languages: javascript-typescript
          # Default query suite covers security + quality. For security-only
          # (fewer findings, higher signal), use:
          #   queries: security-extended
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4

      - name: Run CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          category: "/language:javascript-typescript"

  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --audit-level high catches actionable advisories in our dep tree.
      # --ignore-unfixable skips transitive advisories where the direct
      # dependency hasn't released a patch yet (upstream outside our
      # control). CI still fails on any high advisory we CAN fix.
      - name: Audit JS dependencies
        run: pnpm audit --audit-level high --ignore-unfixable

  cargo-audit:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b1b44fef029483cc79808c5eb89461241fd8f32f # 1.93.0

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit Rust dependencies
        run: cargo audit

  gitleaks:
    name: gitleaks (secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history so the scan covers every commit, not just the diff.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          # Built-in token; no license/secret needed for a public repo.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: semgrep (SAST)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12"

      - name: Install semgrep
        run: pip install semgrep

      # Blocking: only the ERROR-severity custom rules (verified clean against
      # the current tree). The WARNING/heuristic rules run informationally below.
      - name: Custom rules (blocking)
        run: semgrep scan --config rules/ --severity ERROR --error --metrics=off

      # Informational: full custom set + registry rulesets. continue-on-error so
      # pre-existing registry findings surface as annotations without breaking
      # the build until a baseline is triaged.
      - name: Custom + registry rulesets (informational)
        continue-on-error: true
        run: >
          semgrep scan
          --config rules/
          --config p/javascript
          --config p/typescript
          --config p/react
          --config p/owasp-top-ten
          --config p/secrets
          --metrics=off

  snyk:
    name: Snyk (open source + code)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload SARIF to the Security tab
    # Fork PRs cannot read SNYK_TOKEN; the push + scheduled runs cover them.
    if: >-
      ${{ github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set up Snyk CLI
        uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0

      # Open Source — every package.json AND Cargo manifest in the monorepo.
      # Advisory: npm/cargo audit already block on high; this surfaces Snyk's
      # richer advisory DB (incl. licenses) in the Security tab. Fails soft when
      # SNYK_TOKEN is unset, so the job stays green until the secret is added.
      - name: Snyk Open Source test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --all-projects --severity-threshold=high --sarif-file-output=snyk-oss.sarif

      - name: Upload Open Source results
        if: ${{ hashFiles('snyk-oss.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: snyk-oss.sarif
          category: snyk-oss

      # Snyk Code (SAST) — complements CodeQL/semgrep with Snyk's engine.
      - name: Snyk Code test
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk code test --severity-threshold=high --sarif-file-output=snyk-code.sarif

      - name: Upload Code results
        if: ${{ hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4
        with:
          sarif_file: snyk-code.sarif
          category: snyk-code

      # Snapshot the dependency graph on the Snyk dashboard for drift alerts,
      # from main only (avoids a project per branch).
      - name: Snyk monitor
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor --all-projects
