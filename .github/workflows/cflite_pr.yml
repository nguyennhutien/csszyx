name: ClusterFuzzLite PR fuzzing

# Fuzz the native transform engine on changes that touch it, catching panics /
# memory errors in the parser before they reach a release. Uses the build the
# continuous workflow uploaded for the base branch as the crash baseline.
on:
  pull_request:
    # A coarse "could this possibly matter" pre-filter, not the decision. It
    # costs nothing when it does not match, which is most pull requests. What it
    # cannot do is tell a Rust change from a version bump — `packages/core/**`
    # matches `packages/core/package.json`, so every release pull request used
    # to spend five minutes fuzzing to learn that a version string had changed.
    # The job below asks the shared gate that question instead.
    paths:
      - "packages/core/**"
      - ".clusterfuzzlite/**"
      - ".github/workflows/cflite_pr.yml"

permissions: read-all

concurrency:
  group: cflite-pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    uses: ./.github/workflows/detect-changes.yml

  fuzzing:
    needs: detect-changes
    if: needs.detect-changes.outputs.code_rust == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address]
    steps:
      - name: Build fuzzers (${{ matrix.sanitizer }})
        id: build
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: ${{ matrix.sanitizer }}
      - name: Run fuzzers (${{ matrix.sanitizer }})
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 300
          mode: code-change
          sanitizer: ${{ matrix.sanitizer }}
          output-sarif: true
