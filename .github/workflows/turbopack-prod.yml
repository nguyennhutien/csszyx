name: Turbopack Production Build

# Conditional regression suite for the Next.js Turbopack production-build path
# (csszyxTurbopack helper + broad-glob recipe + @csszyx/runtime resolution).
# It is expensive (native engine + a real `next build --turbopack`), so it does
# NOT run on every push. It triggers only when the thing it guards can change:
#   - the Turbopack/Next version (playground/nextjs-16/package.json)
#   - the csszyx Turbopack integration code (packages/unplugin/src/next-*)
#   - the fixture / recipe / this workflow / the verify script
# Plus manual `workflow_dispatch` to re-run on demand (e.g. after a Next release).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'playground/nextjs-16/package.json'
      - 'playground/nextjs-16/next.config.ts'
      - 'playground/nextjs-16/app/turbo-broad/**'
      - 'packages/unplugin/src/next-*.ts'
      - 'scripts/verify-turbopack-prod.sh'
      - '.github/workflows/turbopack-prod.yml'
  pull_request:
    paths:
      - 'playground/nextjs-16/package.json'
      - 'playground/nextjs-16/next.config.ts'
      - 'playground/nextjs-16/app/turbo-broad/**'
      - 'packages/unplugin/src/next-*.ts'
      - 'scripts/verify-turbopack-prod.sh'
      - '.github/workflows/turbopack-prod.yml'

# Nothing here writes: it checks out, installs and runs checks. Said in the file
# rather than left to the repository setting, which is `read` today and is one
# click away from not being.
permissions:
  contents: read

jobs:
  turbo-prod:
    name: Turbopack prod build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Cache turbo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Cache cargo (native build)
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: host-native

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build host native engine
        run: pnpm --filter @csszyx/core native:build -- --clean --native-engine

      - name: Build workspace
        run: pnpm build

      - name: Verify Turbopack production build (broad glob + helper + runtime)
        run: bash scripts/verify-turbopack-prod.sh
