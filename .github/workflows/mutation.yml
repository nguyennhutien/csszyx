name: Mutation Testing

# Monthly full sweep of the Rust transform engine.
#
# Codecov's patch gate proves a changed line RAN under test; it cannot prove
# the suite would go RED if that line were wrong. Mutation testing breaks each
# line on purpose and checks a test notices. The first local run found a real
# survivor in encoder.rs — a tier-5 boundary the suite never encoded, which
# would have collapsed two distinct style indices onto one class name.
#
# REPORTS, DOES NOT GATE. The survivor list is a standing debt register, not a
# per-change signal: it only moves when somebody writes a test, so re-running
# it weekly reprinted the same list for ~5.5 hours of runner time. The
# per-change signal now comes from the diff-scoped job in rust-check, which
# answers in minutes on the lines a pull request actually touched. This sweep
# stays for what a diff cannot see — a change that breaks code it never edits.
on:
  schedule:
    # Monthly, 04:00 UTC on the first — after the daily fuzz batch at 03:00, so
    # the two long Rust jobs do not contend for runners.
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mutation-sweep
  cancel-in-progress: true

jobs:
  sweep:
    name: Shard ${{ matrix.shard }}/8
    runs-on: ubuntu-latest
    # ~2600 mutants at ~12s each is roughly nine hours sequentially; eight
    # shards bring that to ~1.1h apiece. The ceiling is generous because a
    # mutant that makes a loop non-terminating burns its full timeout.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        # cargo-mutants numbers shards from ZERO: `--shard k/n` requires
        # k < n. A one-based list spends one job on an invalid `8/8`, which
        # exits immediately, and never asks for slice `0/8` at all — so an
        # eighth of the mutants went unmeasured while the sweep still looked
        # like it covered everything.
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b # 1.97.1

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.toml') }}

      - name: Install cargo-mutants
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-mutants

      # Called directly rather than through the local `pnpm mut:shard` wrapper:
      # the shard only needs cargo, and installing the JS workspace to reach a
      # script that shells straight back to cargo would add minutes per shard
      # for nothing.
      #
      # --features is spelled out rather than left to .cargo/mutants.toml. The
      # engine only exists behind native-engine; without it every mutant lands
      # in a crate whose transform module is compiled out and reports back as
      # unviable — a green run that measured nothing. Stating it here keeps the
      # scheduled sweep correct even if that config file is absent or edited.
      #
      # migrate is named for the same reason and fails worse when it is not:
      # its module is compiled out without it, and a mutant in code that is not
      # compiled builds and passes, so it reports as MISSED rather than
      # unviable. A sweep reporting a module's whole surface as missed reads as
      # a suite worth fixing rather than a run worth rerunning.
      #
      # --in-place matters even on a throwaway runner: without it cargo-mutants
      # copies the whole workspace per build job.
      - name: Run shard
        run: cargo mutants --in-place --features native-engine,migrate --shard ${{ matrix.shard }}/8

      - name: Upload shard outcomes
        # Always: a shard that times out still carries the outcomes of every
        # mutant it finished, and dropping them would silently shrink the score.
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out/outcomes.json
          retention-days: 14

  report:
    name: Report
    needs: sweep
    # Runs even when a shard fails or times out, so a partial sweep still
    # publishes what it learned instead of reporting nothing.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The report script is stdlib-only, so no pnpm install — but it uses
      # fs.globSync, which needs a Node new enough to have it. Pin rather than
      # inherit whatever the runner image ships.
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"

      - name: Download shard outcomes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mutants-shard-*
          path: shards

      - name: Merge into a step summary
        run: node scripts/mutants-report.mjs shards >> "$GITHUB_STEP_SUMMARY"
