name: Coverage

# Measures and uploads coverage for both languages as separate Codecov flags:
#   - `typescript` — vitest v8 lcov
#   - `rust`       — cargo-llvm-cov lcov (native engine)
# Codecov gates patch coverage and per-language project coverage (see
# codecov.yml). Each upload is isolated to its declared reports so flags cannot
# silently absorb another language's coverage files.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Coverage gate
    uses: ./.github/workflows/detect-changes.yml

  coverage:
    needs: detect-changes
    # Nothing to measure when neither language changed. Coverage of a diff with
    # no source in it is the previous commit's number, recomputed for eight
    # minutes — the v0.13.0 release pull request paid exactly that for 25
    # version bumps and a changelog. Codecov carries the last upload forward for
    # a flag that receives none, which is the case this produces.
    if: needs.detect-changes.outputs.code_ts == 'true' || needs.detect-changes.outputs.code_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The default `rust` parser drives the rust-parity tests, so the host
      # native addon must exist before the TS suite runs.
      - name: Build host native engine
        run: pnpm --filter @csszyx/core native:build -- --clean --native-engine

      # Tests import built artifacts (`@csszyx/compiler/browser`, the WASM
      # `pkg-node`, `cli/dist`, …); without the workspace build ~86 suites fail
      # to import and coverage collapses (~36%). turbo caches this.
      - name: Cache Astro fonts
        uses: ./.github/actions/cache-astro-fonts

      - name: Build workspace
        run: pnpm build

      # --- TypeScript coverage (vitest v8) ---
      - name: TypeScript coverage
        run: pnpm test:coverage

      # Second lcov source under the same flag: c8 for @csszyx/ts-plugin, whose
      # suites are standalone node scripts (real tsserver, packed tarball) that
      # vitest never runs. Keeping it explicit makes a missing report fail
      # visibly instead of silently shrinking the TypeScript coverage surface.
      - name: ts-plugin coverage (c8)
        run: pnpm --filter @csszyx/ts-plugin test:coverage

      - name: Verify TypeScript coverage reports
        run: test -s coverage/lcov.info && test -s packages/ts-plugin/coverage/lcov.info

      - name: Upload TypeScript coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info,packages/ts-plugin/coverage/lcov.info
          disable_search: true
          flags: typescript
          name: typescript
          fail_ci_if_error: true

      # --- Rust coverage (cargo-llvm-cov) ---
      - name: Add llvm-tools
        run: rustup component add llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-llvm-cov

      - name: Rust coverage
        run: pnpm cov:rust

      - name: Verify Rust coverage report
        run: test -s coverage/rust-lcov.info

      - name: Upload Rust coverage
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/rust-lcov.info
          disable_search: true
          flags: rust
          name: rust
          fail_ci_if_error: true
