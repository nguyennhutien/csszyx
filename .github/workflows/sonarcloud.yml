name: SonarCloud

# CI-based SonarQube Cloud analysis (code quality + security + coverage). Disable
# "Automatic Analysis" in the SonarCloud project (Administration → Analysis Method)
# or this CI analysis is rejected as a duplicate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonarcloud-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Fork PRs cannot read SONAR_TOKEN; the push runs cover them.
    if: >-
      ${{ github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          # Full history so SonarCloud computes new-code and blame correctly.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "24"
          cache: "pnpm"

      # Use a runner-managed JRE so transient failures from SonarCloud's JRE
      # provisioning endpoint cannot prevent the scanner from starting.
      - name: Setup Java
        uses: actions/setup-java@0f481fcb613427c0f801b606911222b5b6f3083a # v5
        with:
          distribution: "temurin"
          java-version: "21"

      # @csszyx/core#build runs wasm-pack, so the WASM toolchain must be present.
      - name: Setup WASM toolchain
        uses: ./.github/actions/setup-wasm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The default rust parser drives the rust-parity tests; build the host addon
      # so the coverage run is clean.
      - name: Build host native engine
        run: pnpm --filter @csszyx/core native:build -- --clean --native-engine

      # Tests import built artifacts; without the workspace build ~86 suites fail
      # to import and coverage collapses. turbo caches this.
      - name: Build workspace
        run: pnpm build

      # Generate lcov for SonarCloud. The one flaky watcher test is tolerated
      # (reportOnFailure still writes the report); ci.yml is the real test gate.
      - name: Coverage
        run: pnpm test:coverage
        continue-on-error: true

      # ts-plugin adds its own c8 lcov (node-script suites vitest never runs);
      # sonar-project.properties lists both report paths. A separate step so a
      # vitest flake above cannot skip this report.
      - name: ts-plugin coverage (c8)
        run: pnpm --filter @csszyx/ts-plugin test:coverage
        continue-on-error: true

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@713881670b6b3676cda39549040e2d88c70d582e # v8.2.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_SCANNER_SKIP_JRE_PROVISIONING: "true"
