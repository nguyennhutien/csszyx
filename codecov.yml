# Codecov configuration. Two language flags are uploaded separately:
#   - `typescript` — vitest v8 lcov (packages/*/src/**/*.ts)
#   - `rust`       — cargo-llvm-cov lcov (packages/core/src/**/*.rs)
# carryforward keeps a flag's last coverage when a build does not re-run that
# language's tests, so a TS-only change does not show a phantom Rust drop.
#
# Status checks are informational for now (they comment but do not block merges)
# while TS coverage is brought above the OpenSSF Silver target of 80%.

codecov:
  require_ci_to_pass: true

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
      typescript:
        target: 80%
        flags:
          - typescript
        informational: true
      rust:
        target: 80%
        flags:
          - rust
        informational: true
    patch:
      default:
        target: 80%
        informational: true

flags:
  typescript:
    carryforward: true
  rust:
    paths:
      - packages/core/src/
    carryforward: true

comment:
  layout: "header, flags, files"
  require_changes: false
