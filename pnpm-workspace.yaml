packages:
  - "packages/*"
  - "apps/*"
  - "playground/*"

# pnpm 11 reads workspace configuration here, not from package.json#pnpm.
overrides:
  "brace-expansion@>=5.0.0 <5.0.7": "^5.0.7"
  "devalue@>=5.0.0 <5.8.1": "^5.8.1"
  "esbuild@>=0.17.0 <0.28.1": "^0.28.1"
  "form-data@>=4.0.0 <4.0.6": "^4.0.6"
  "http-proxy-middleware@>=2.0.0 <3.0.6": "^3.0.6"
  "js-yaml@>=4.0.0 <4.2.0": "^4.2.0"
  "lodash@>=4.0.0 <4.18.0": "^4.18.1"
  "markdown-it@>=14.0.0 <14.2.0": "^14.2.0"
  "minimatch@>=10.0.0 <10.2.3": "^10.2.5"
  "postcss@>=8.0.0 <8.5.10": "^8.5.15"
  "qs@>=6.0.0 <6.15.2": "^6.15.2"
  "shell-quote@>=1.0.0 <1.8.4": "^1.8.4"
  "tmp@>=0.2.0 <0.2.6": "^0.2.7"
  "undici@>=7.0.0 <7.28.0": "^7.28.0"
  "vite@>=6.0.0 <6.4.3": "^6.4.3"
  "vite@>=7.0.0 <7.3.2": "^7.3.5"
  "vite@>=8.0.0 <8.0.16": "^8.0.16"
  "ws@>=8.0.0 <8.20.1": "^8.21.0"

supportedArchitectures:
  os:
    - darwin
    - linux
    - win32
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl

# Dependency lifecycle scripts stay denied unless a package is reviewed and
# explicitly granted here. Keep unknown scripts warning-only so adding a package
# cannot turn the install gate red before maintainers can record a false entry.
strictDepBuilds: false
allowBuilds: {}
auditConfig: {}

# mise is the single toolchain manager (pnpm pinned in .mise.toml), so pnpm must
# not self-download a packageManager-field version: that re-execs a self-fetched
# binary the firewalled devcontainer cannot reach (blank placeholder → exit 127).
# pnpm 11 reads this from here, not .npmrc.
managePackageManagerVersions: false

# pnpm 11 added a deps-status precheck before every `pnpm exec`/`pnpm run`. The
# devcontainer's node_modules is a cross-platform bind mount (darwin optional deps
# from the host install, linux here), which makes that precheck crash and breaks
# the lefthook ts-js gate. pnpm 10 had no such precheck; the sync-lockfile hook and
# CI's frozen install already guard staleness, so restore the pnpm 10 behavior.
verifyDepsBeforeRun: false

# Install/hoisting behavior. pnpm 11 no longer reads these from .npmrc, so they
# move here. shamefullyHoist keeps the flat node_modules the repo relies on
# (several playgrounds import packages like @vitejs/plugin-react that a parent
# hoists but they do not declare); dropping it breaks their build with
# ERR_MODULE_NOT_FOUND. These reproduce the pre-pnpm-11 .npmrc values exactly.
shamefullyHoist: true
strictPeerDependencies: false
autoInstallPeers: true
