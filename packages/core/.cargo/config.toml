# Disable the WASM `reference-types` feature so wasm-bindgen does not emit
# `__wbindgen_init_externref_table` in the generated JS glue. Node.js 22
# rejects the `WebAssembly.Table.grow(4)` call that wasm-bindgen emits to
# initialise that table, so pkg-node output cannot be `require()`d from a
# Node 22 build (e.g. webpack-cli loading webpack.config.js in the
# @csszyx/playground-webpack-react build).
#
# This restriction targets the wasm32 build only; Cargo's native test path
# is unaffected.

[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=-reference-types"]
