[package]
name = "csszyx-core"
version = "0.0.0"
authors = ["Tien Nguyen <tien@example.com>"]
edition = "2021"
description = "Performance-critical core for csszyx CSS-in-JS framework"
license = "MIT"
repository = "https://github.com/nguyennhutien/csszyx"

[lib]
crate-type = ["cdylib", "rlib"]

# Pin wasm-bindgen to the last release that does NOT enable the
# WASM `reference-types` feature by default. Newer versions (0.2.95+)
# emit a `__wbindgen_init_externref_table` call that does
# `WebAssembly.Table.grow(4)`, which Node 22's stricter V8 rejects with
# `RangeError: WebAssembly.Table.grow(): failed to grow table by 4`
# when Node tries to load pkg-node/csszyx_core.js — breaking the
# @csszyx/playground-webpack-react build step in CI.
[dependencies]
wasm-bindgen = "=0.2.93"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"
napi = { version = "3.9.0", default-features = false, features = ["napi4"], optional = true }
napi-derive = { version = "3.5.6", optional = true }
oxc_allocator = { version = "0.126.0", optional = true }
oxc_parser = { version = "0.126.0", optional = true }
oxc_semantic = { version = "0.126.0", optional = true }
oxc_span = { version = "0.126.0", optional = true }
rayon = { version = "1.12.0", optional = true }
string_wizard = { version = "0.0.27", optional = true }

[dev-dependencies]
wasm-bindgen-test = "=0.3.43"

[features]
default = []
native = ["dep:napi", "dep:napi-derive"]
native-engine = [
    "dep:oxc_allocator",
    "dep:oxc_parser",
    "dep:oxc_semantic",
    "dep:oxc_span",
    "dep:rayon",
    "dep:string_wizard",
]

# Note: [profile.release] lives in the workspace root Cargo.toml.
# Cargo ignores profile sections in non-root workspace members and emits a
# warning if declared here.

# Disable wasm-pack's built-in wasm-opt invocation.
# Rationale: wasm-pack auto-downloads binaryen (~4MB tarball) from GitHub
# Releases on first run, which is occasionally flaky (504/timeout). CI + dev
# builds do not need the wasm-opt size pass — rustc's release profile above
# already does aggressive optimization. Release workflow runs wasm-opt
# manually using apt-installed binaryen so production ships fully optimized
# WASM without exposing CI to the flaky download path.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lints]
workspace = true
