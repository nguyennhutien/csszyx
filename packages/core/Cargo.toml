[package]
name = "csszyx-core"
version = "0.0.0"
authors = ["Tien Nguyen <tien@example.com>"]
edition = "2021"
description = "Performance-critical core for csszyx CSS-in-JS framework"
license = "MIT"
repository = "https://github.com/nguyennhutien/csszyx"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6.5"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lints]
workspace = true

