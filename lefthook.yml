# Lefthook replaces Husky + lint-staged for local git hooks.
# Keep commit validation separate from release generation: commit-msg calls
# the Cocogitto wrapper, while release-please remains the only changelog owner.

pre-commit:
  # Commands run in parallel. Each command groups steps that share files
  # and chains them with `set -e` so writes inside a chain stay
  # sequential. Disjoint file globs (TS vs Rust vs Markdown vs JSON
  # vs lockfile) cannot race across commands, so the parallel pool is
  # safe and ~2-3s faster than the previous fully-serial run.
  parallel: true
  commands:
    # TS/JS/JSON/CSS chain. Order matters because every step writes to
    # the same staged files: biome auto-fixes safe issues, biome strict
    # then catches anything the auto-fix skipped silently (mirrors CI's
    # `biome check`), eslint --fix lands its complementary rule fixes,
    # tsc -b verifies the workspace types end-to-end. set -e + chained
    # invocations preserve the fail-fast behaviour the separate-commands
    # version had.
    #
    # Biome owns ALL JSON formatting now (the former prettier-json chain).
    # biome.json carries a prettier-matching override (2-space, 80 cols)
    # for the root/app/playground JSON that prettier used to format —
    # verified byte-identical output on every file of that set — while
    # packages/tsconfig-root JSON keeps biome's 4-space. json5 is out: no
    # tracked .json5 exists and biome does not parse json5; if one ever
    # appears it needs its own formatter.
    ts-js:
      # `.mjs` and `.cjs` MUST stay in this glob: biome.json includes
      # `scripts/**/*.mjs` and `**/*.mjs`, and eslint.config.js lints both
      # `**/*.cjs` and `**/*.mjs`. Dropping them lets the same kind of
      # format/import-order regression that escaped PR #28's first push
      # slip through the local gate again.
      glob: "*.{js,cjs,mjs,jsx,ts,tsx,json,jsonc,css}"
      exclude:
        - "package.json"
        - "**/package.json"
        - ".release-please-manifest.json"
        - "apps/docs/src/styles/landing.css"
        # Root Biome/ESLint configs ignore playgrounds. Their framework-pinned
        # local linters (not root ESLint 10) own those fixtures.
        - "playground/**"
      run: |
        set -e
        pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
        pnpm exec biome check --no-errors-on-unmatched {staged_files}
        pnpm exec eslint --fix --no-warn-ignored --cache --cache-location node_modules/.cache/eslint {staged_files}
        pnpm exec tsc -b --pretty false
      stage_fixed: true

    # Rust chain. rustfmt writes formatted source, then clippy --fix
    # applies its lints to the formatted result. Both target the same
    # .rs files so they must stay sequential within this command.
    rust:
      glob: "*.rs"
      run: |
        set -e
        rustfmt --edition 2021 {staged_files}
        cargo clippy --fix --allow-dirty --allow-staged -- -D warnings
      stage_fixed: true

    # Markdown chain. markdownlint --fix and prettier --write both
    # rewrite the same .md files, so this stays sequential too.
    md:
      glob: "*.md"
      run: |
        set -e
        pnpm exec markdownlint --fix {staged_files}
        pnpm exec prettier --write {staged_files}
      stage_fixed: true

    sync-lockfile:
      run: node scripts/sync-lockfile-if-needed.mjs

commit-msg:
  commands:
    validate:
      run: scripts/verify-commit-message.sh {1}

# Catch CI-style failures before they reach the runner. Pre-push runs the
# strict lint, type-check, unit tests, and workspace build that the
# corresponding CI jobs would run. This is the lighter sibling of
# `pnpm verify:ci`: it does not wipe dist/.turbo/.csszyx caches, so it
# misses cache-masked turbo cycles — those are caught by `pnpm pr:ready`
# (full mirror with cache wipe + e2e) which is the recommended manual
# step before opening a PR.
#
# Bypass with `git push --no-verify` for WIP pushes that are not meant
# to pass CI (e.g. mid-feature backups to a private mirror remote).
pre-push:
  parallel: false
  commands:
    verify-pre-push:
      # Only verify pushes to origin. Private mirror (feature) and AI
      # docs (private/internal/docs) don't need verification — CI runs
      # on origin after PR creation.
      # {push_remote} is lefthook's template for the remote name.
      skip:
        - ref: refs/heads/internal/*
      run: |
        remote="{push_remote}"
        if [ "$remote" != "origin" ] && [ -n "$remote" ]; then
          echo "[pre-push] Remote '$remote' — skipping verification."
          exit 0
        fi
        exec pnpm verify:pre-push
