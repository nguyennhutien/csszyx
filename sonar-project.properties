# SonarQube Cloud (SonarCloud) — CI-based analysis. Confirm the two keys below
# match your SonarCloud project (Administration → click the project; the org and
# project key are shown there).
sonar.organization=nguyennhutien
sonar.projectKey=nguyennhutien_csszyx

# Analyze the TypeScript/JavaScript packages. Rust stays on the project's own
# clippy gates (three feature sets, incl. native-engine) + cargo-audit + fuzzing,
# which cover more than SonarCloud's default-feature clippy would; .rs is excluded.
sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=**/tests/**,**/*.test.ts,**/*.test.tsx

sonar.exclusions=\
  **/dist/**,\
  **/node_modules/**,\
  **/*.rs,\
  **/generated/**,\
  **/*.type-test.ts,\
  **/*.d.ts,\
  packages/core/fuzz/**,\
  packages/e2e/**,\
  apps/**,\
  playground/**,\
  **/scripts/**

# Coverage comes from `pnpm test:coverage` (v8 lcov). Exclude non-runtime / editor
# packages from the coverage denominator, matching vitest.config.ts.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  **/tests/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.type-test.ts,\
  packages/types/**,\
  packages/vscode/**

# Rule suppressions — false positives specific to this codebase.
sonar.issue.ignore.multicriteria=szprop,uniontypes,strsort

# S6747: `sz` is CSSzyx's core custom JSX prop, valid on every element; the
# generic unknown-DOM-property check cannot know that (~1000 findings).
sonar.issue.ignore.multicriteria.szprop.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.szprop.resourceKey=**/*.tsx

# S6571: the sz prop types intentionally model wide unions (literal + branded
# members); the "redundant" members are part of the type augmentation, not dead code.
sonar.issue.ignore.multicriteria.uniontypes.ruleKey=typescript:S6571
sonar.issue.ignore.multicriteria.uniontypes.resourceKey=**/types/**

# S2871: every bare `.sort()` in the source is on a typed `string[]` (class names,
# mangle tokens, filenames, theme keys). The default lexicographic sort is exactly
# what the build needs — deterministic AND locale-independent; the rule's suggested
# `localeCompare` would make output order locale-dependent and break reproducible
# builds. Verified there are no numeric `.sort()` calls that the rule would catch.
sonar.issue.ignore.multicriteria.strsort.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.strsort.resourceKey=**/*.ts
