# SonarQube Cloud (SonarCloud) — CI-based analysis. Confirm the two keys below
# match your SonarCloud project (Administration → click the project; the org and
# project key are shown there).
sonar.organization=nguyennhutien
sonar.projectKey=nguyennhutien_csszyx

# Analyze the TypeScript/JavaScript packages. Rust stays on the project's own
# clippy gates (three feature sets, incl. native-engine) + cargo-audit + fuzzing,
# which cover more than SonarCloud's default-feature clippy would; .rs is excluded.
sonar.sources=packages
sonar.tests=packages
sonar.test.inclusions=**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.bench.ts

sonar.exclusions=\
  **/dist/**,\
  **/node_modules/**,\
  **/*.rs,\
  **/generated/**,\
  **/*.type-test.ts,\
  **/*.d.ts,\
  packages/core/fuzz/**,\
  packages/e2e/**,\
  apps/**,\
  playground/**,\
  **/scripts/**

# Coverage comes from `pnpm test:coverage` (v8 lcov). Exclusions mirror
# vitest.config.ts: only type-only surfaces and the VS Code host-activation
# wiring (needs a real VS Code instance) sit outside the denominator; the rest
# of packages/vscode is measured headless via the mocked `vscode` module.
# `build.config.ts` joins them for the same reason `**/scripts/**` is already
# out: it is unbuild's own hook wiring, executed by `pnpm build` and by nothing
# a test can drive without running a package build. The esbuild bundlers, the
# documentation example and the hand-run mapping script are the same shape: a
# build step, a snippet for a reader, and a console.log nothing imports.
#
# This list is the denominator, so anything left off it that no coverage run
# instruments counts every line as uncovered. That is not a rounding error on
# new code: a file absent from every report reads as nought out of its whole
# changed surface, which is how six new lines in the native loader arrived as
# a coverage failure while every local check called them covered.
sonar.javascript.lcov.reportPaths=coverage/lcov.info,packages/ts-plugin/coverage/lcov.info
sonar.coverage.exclusions=\
  **/tests/**,\
  **/build.config.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.bench.ts,\
  **/*.type-test.ts,\
  packages/types/**,\
  packages/vscode/src/extension.ts,\
  **/esbuild.mjs,\
  packages/*/examples/**,\
  packages/compiler/test-ux-mapping.ts

# Rule suppressions — false positives specific to this codebase.
sonar.issue.ignore.multicriteria=szprop,uniontypes

# S6747: `sz` is CSSzyx's core custom JSX prop, valid on every element; the
# generic unknown-DOM-property check cannot know that (~1000 findings).
sonar.issue.ignore.multicriteria.szprop.ruleKey=typescript:S6747
sonar.issue.ignore.multicriteria.szprop.resourceKey=**/*.tsx

# S6571: the sz prop types intentionally model wide unions (literal + branded
# members); the "redundant" members are part of the type augmentation, not dead code.
sonar.issue.ignore.multicriteria.uniontypes.ruleKey=typescript:S6571
sonar.issue.ignore.multicriteria.uniontypes.resourceKey=**/types/**

# S2871 (bare `.sort()`) is no longer suppressed: all sorts now route through the
# type-checked `sortStrings()` helper (with an explicit comparator) or an explicit
# comparator, and a lint rule forbids bare `.sort()`, so the finding cannot recur.
