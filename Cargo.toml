[workspace]
members = [
    "packages/core",
]
resolver = "2"

[workspace.lints.rust]
# Enforce documentation for all public items
missing_docs = "deny"

[workspace.lints.clippy]
# Enable all default lints
all = { level = "warn", priority = -1 }
# Enable all pedantic lints for high-quality code
pedantic = { level = "warn", priority = -1 }
# Enable nursery lints for early feedback on improved code patterns
nursery = { level = "warn", priority = -1 }
# Check Cargo.toml for common issues
cargo = { level = "warn", priority = -1 }
# Enforce documentation for public items within clippy as well
missing_docs_in_private_items = "deny"

# --- Custom overrides ---
# Some arguments are necessary even if many
too_many_arguments = "allow"

# Release profile for all workspace members (currently just packages/core).
# Must live at workspace root — Cargo ignores [profile.*] in non-root members.
# Tuned for WASM: aggressive size + speed optimization; wasm-opt runs as a
# post-step (see packages/core/scripts/run-wasm-opt.mjs) for further shrinking.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
