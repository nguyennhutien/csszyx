# cargo-mutants configuration for the Rust transform engine.
#
# Mutation testing answers the one question line coverage cannot: would the
# test suite go RED if this line were wrong? Codecov's patch=100% gate proves
# a changed line RAN under test; it does not prove a loose assertion would
# catch a defect in it. For an engine whose whole job is emitting the correct
# class string, that gap is the expensive one.
#
# Run it through the wrapper, never bare:
#
#   pnpm mut:diff          # mutants in the current diff vs main (the PR gate)
#   pnpm mut:file <path>   # every mutant in one file
#
# ---------------------------------------------------------------------------
# WHY THE WRAPPER PASSES --in-place (do not drop it)
#
# Without --in-place, cargo-mutants copies the whole workspace tree for every
# build job. On this repo that copy is ~31G: .pnpm-store alone is 24G and
# node_modules another 5.7G. Worse, the container's overlayfs cannot reflink,
# so the copy-on-write fast path degrades to a real byte-for-byte copy:
#
#   Reflink failed: Invalid cross-device link (os error 18), falling back to
#   regular copy
#
# That fills the disk. The keys below shrink the copy if it ever happens
# anyway, but --in-place is what actually prevents it.
# ---------------------------------------------------------------------------

# The engine only exists behind this feature; without it cargo-mutants would
# mutate a crate whose transform module is compiled out and report everything
# as unviable.
features = ["native-engine"]

# Safety net for a run that somehow skips --in-place: honour .gitignore so the
# copy excludes node_modules, .pnpm-store, target/ and dist/ (all ignored),
# and skip target/ and .git explicitly. Copy drops from ~31G to ~1G.
gitignore = true
copy_target = false
copy_vcs = false

# ---------------------------------------------------------------------------
# EXCLUDED — mutants here report as missed while measuring nothing.
#
# The weekly sweep is only useful if its survivor list is a to-do list. These
# two paths produced 301 of the first full run's 549 survivors and not one of
# them was a test worth writing, which buries the ones that are.
#
# transform/generated/ — the lookup tables are emitted from the TypeScript
# compiler's PROPERTY_MAP/VARIANT_MAP by a generator, and a hand-edit is
# already caught by the regeneration check CI runs, which cargo-mutants does
# not. Most arms return exactly what the caller's kebab-case fallback rebuilds
# when the lookup misses, so deleting one changes no class name; the only test
# that could kill it would assert the table against itself.
#
# native.rs — the napi bridge is behind the `native` feature, which this file
# does not enable. The module compiles out, so its mutants leave the suite
# untouched and every one of them comes back missed.
# ---------------------------------------------------------------------------
exclude_globs = [
    "packages/core/src/transform/generated/**",
    "packages/core/src/native.rs",
]
